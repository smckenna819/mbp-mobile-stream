<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBP Overlay</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    color:#fff;
}

/* =========================================================
   MASTER 1920 x 1080 STAGE
   ========================================================= */

#stage{
    position:absolute;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/*
    Everything inside this canvas is designed at 1920x1080.
    Browser scales the complete overlay together.
*/

#canvas{
    position:absolute;
    width:1920px;
    height:1080px;
    left:50%;
    top:50%;
    transform-origin:center center;
}


/* =========================================================
   SCOREBOARD SHELL
   ========================================================= */

#shell{
    position:absolute;
    left:0;
    top:0;
    width:1920px;
    height:1080px;
    object-fit:contain;
    pointer-events:none;
}


/* =========================================================
   PLAYER 1
   ========================================================= */

#player1Block{
    position:absolute;
    left:405px;
    top:812px;
    width:300px;
    height:82px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

#player1Name{
    font-size:30px;
    line-height:32px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:0 2px 3px #000;
}

#player1Info{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:7px;
}

#break1{
    display:none;
    background:#f01822;
    padding:3px 15px 4px;
    font-size:19px;
    line-height:20px;
    font-weight:900;
    font-style:italic;
    transform:skew(-8deg);
    text-shadow:0 1px 2px #000;
}

#fargo1{
    font-size:21px;
    color:#e5e5e5;
    text-shadow:0 2px 3px #000;
}


/* =========================================================
   PLAYER 2
   ========================================================= */

#player2Block{
    position:absolute;
    left:1215px;
    top:812px;
    width:300px;
    height:82px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:right;
}

#player2Name{
    font-size:30px;
    line-height:32px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:0 2px 3px #000;
}

#player2Info{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:14px;
    margin-top:7px;
}

#break2{
    display:none;
    background:#f01822;
    padding:3px 15px 4px;
    font-size:19px;
    line-height:20px;
    font-weight:900;
    font-style:italic;
    transform:skew(-8deg);
    text-shadow:0 1px 2px #000;
}

#fargo2{
    font-size:21px;
    color:#e5e5e5;
    text-shadow:0 2px 3px #000;
}


/* =========================================================
   SCORES
   ========================================================= */

.score{
    position:absolute;
    top:803px;
    width:92px;
    height:92px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:56px;
    line-height:1;
    font-weight:900;
    text-align:center;
    text-shadow:0 3px 4px #000;
}

#score1{
    left:711px;
}

#score2{
    left:1117px;
}


/* =========================================================
   CENTER MBP LOGO
   ========================================================= */

#mbpLogo{
    position:absolute;
    left:50%;
    top:800px;
    transform:translateX(-50%);
    width:225px;
    height:100px;
    object-fit:contain;
}


/* =========================================================
   SPONSOR LOGOS
   ========================================================= */

.sponsor{
    position:absolute;
    top:792px;
    width:260px;
    height:118px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.sponsor img{
    max-width:88%;
    max-height:88%;
    object-fit:contain;
}

#leftSponsor{
    left:22px;
}

#rightSponsor{
    right:22px;
}


/* =========================================================
   LOWER MATCH BAR
   ========================================================= */

#gameText,
#formatText,
#raceText{
    position:absolute;
    top:917px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    line-height:22px;
    font-weight:900;
    white-space:nowrap;
    text-shadow:0 2px 3px #000;
}

#gameText{
    left:575px;
    width:220px;
}

#formatText{
    left:800px;
    width:320px;
}

#raceText{
    left:1125px;
    width:220px;
}


/* =========================================================
   9 BALL ICON
   ========================================================= */

#ballIcon{
    display:inline-flex;
    width:29px;
    height:29px;
    border-radius:50%;
    background:#f1c40f;
    color:#111;
    align-items:center;
    justify-content:center;
    margin-right:9px;
    border:2px solid #fff;
    font-size:15px;
    font-weight:900;
    text-shadow:none;
}


/* =========================================================
   ONE POCKET BALL COUNTERS
   ========================================================= */

#onePocket{
    display:none;
    position:absolute;
    left:50%;
    top:742px;
    transform:translateX(-50%);
    background:rgba(5,5,7,.95);
    border:2px solid #999;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,.7);
}

.ballCount{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:9px 22px;
    font-size:18px;
    font-weight:800;
}

.ballCount:first-child{
    border-right:1px solid #666;
}

.ballCount strong{
    font-size:25px;
}


/* =========================================================
   OPTIONAL EVENT / VENUE
   ========================================================= */

#venue{
    display:none;
    position:absolute;
    left:50%;
    top:755px;
    transform:translateX(-50%);
    padding:8px 24px;
    border-radius:7px;
    background:rgba(8,8,10,.90);
    border:1px solid #777;
    font-size:18px;
    font-weight:800;
    letter-spacing:.04em;
    white-space:nowrap;
}


/* =========================================================
   HIDDEN
   ========================================================= */

.hidden{
    display:none !important;
}

</style>
</head>

<body>

<div id="stage">

    <div id="canvas">

        <!-- FIXED SCOREBOARD ART -->
        <img
            id="shell"
            src="scoreboard-shell.png"
            alt=""
        >


        <!-- LEFT SPONSOR -->
        <div id="leftSponsor" class="sponsor">
            <img id="leftSponsorImg" src="" alt="">
        </div>


        <!-- PLAYER 1 -->
        <div id="player1Block">

            <div id="player1Name">
                PLAYER ONE
            </div>

            <div id="player1Info">

                <div id="break1">
                    BREAK
                </div>

                <div id="fargo1">
                    Fargo 620
                </div>

            </div>

        </div>


        <!-- SCORE 1 -->
        <div id="score1" class="score">
            0
        </div>


        <!-- CENTER MBP LOGO -->
        <img
            id="mbpLogo"
            src="mbp-logo.png"
            alt="McKenna Billiard Productions"
        >


        <!-- SCORE 2 -->
        <div id="score2" class="score">
            0
        </div>


        <!-- PLAYER 2 -->
        <div id="player2Block">

            <div id="player2Name">
                PLAYER TWO
            </div>

            <div id="player2Info">

                <div id="fargo2">
                    Fargo 598
                </div>

                <div id="break2">
                    BREAK
                </div>

            </div>

        </div>


        <!-- RIGHT SPONSOR -->
        <div id="rightSponsor" class="sponsor">
            <img id="rightSponsorImg" src="" alt="">
        </div>


        <!-- LOWER BAR -->

        <div id="gameText">
            <span id="ballIcon">9</span>
            <span id="gameLabel">9-BALL</span>
        </div>

        <div id="formatText">
            SCOTCH DOUBLES
        </div>

        <div id="raceText">
            RACE TO 5
        </div>


        <!-- ONE POCKET -->

        <div id="onePocket">

            <div class="ballCount">
                P1 BALLS
                <strong id="balls1">0</strong>
            </div>

            <div class="ballCount">
                P2 BALLS
                <strong id="balls2">0</strong>
            </div>

        </div>


        <!-- OPTIONAL VENUE -->

        <div id="venue"></div>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>

<script>

/* =========================================================
   SCALE THE 1920x1080 MASTER CANVAS
   ========================================================= */

function scaleCanvas(){

    const canvas = document.getElementById("canvas");

    const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
    );

    canvas.style.transform =
        "translate(-50%, -50%) scale(" + scale + ")";

}

window.addEventListener("resize", scaleCanvas);
scaleCanvas();


/* =========================================================
   FIREBASE
   ========================================================= */

firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const matchRef = database.ref("match");


/* =========================================================
   RENDER
   ========================================================= */

function render(data){

    if(!data) return;

    const p1 = data.player1 || {};
    const p2 = data.player2 || {};

    document.getElementById("player1Name").textContent =
        p1.name || "PLAYER ONE";

    document.getElementById("player2Name").textContent =
        p2.name || "PLAYER TWO";


    document.getElementById("score1").textContent =
        Number(p1.score) || 0;

    document.getElementById("score2").textContent =
        Number(p2.score) || 0;


    document.getElementById("fargo1").textContent =
        p1.fargo ? "Fargo " + p1.fargo : "";

    document.getElementById("fargo2").textContent =
        p2.fargo ? "Fargo " + p2.fargo : "";


    const game = data.game || "9-Ball";

    document.getElementById("gameLabel").textContent =
        game.toUpperCase();


    /*
       Ball icon only makes sense for numbered-ball games.
    */

    const ballIcon =
        document.getElementById("ballIcon");

    if(game === "9-Ball"){

        ballIcon.style.display = "inline-flex";
        ballIcon.textContent = "9";

    }
    else if(game === "8-Ball"){

        ballIcon.style.display = "inline-flex";
        ballIcon.textContent = "8";

    }
    else if(game === "10-Ball"){

        ballIcon.style.display = "inline-flex";
        ballIcon.textContent = "10";

    }
    else{

        ballIcon.style.display = "none";

    }


    document.getElementById("raceText").textContent =
        "RACE TO " + (data.race || 5);


    /*
       Keep Scotch Doubles for now.
       We can connect this to the controller next.
    */

    document.getElementById("formatText").textContent =
        data.format || "SCOTCH DOUBLES";


    /*
       Break indicator.
       Supports several possible Firebase values.
    */

    const breaker =
        data.breaker ??
        data.break ??
        data.breakPlayer ??
        0;

    document.getElementById("break1").style.display =
        breaker == 1 ? "block" : "none";

    document.getElementById("break2").style.display =
        breaker == 2 ? "block" : "none";


    /*
       One Pocket
    */

    const onePocket =
        document.getElementById("onePocket");

    if(game === "One Pocket"){

        onePocket.style.display = "flex";

        document.getElementById("balls1").textContent =
            data.balls1 || 0;

        document.getElementById("balls2").textContent =
            data.balls2 || 0;

    }
    else{

        onePocket.style.display = "none";

    }


    /*
       Venue / event.
       Hidden unless Firebase contains one.
    */

    const venue =
        document.getElementById("venue");

    if(data.venue){

        venue.textContent = data.venue;
        venue.style.display = "block";

    }
    else{

        venue.style.display = "none";

    }


    /*
       Sponsor images.
       These can be connected to the controller later.
    */

    if(data.leftSponsor){

        document.getElementById("leftSponsorImg").src =
            data.leftSponsor;

    }

    if(data.rightSponsor){

        document.getElementById("rightSponsorImg").src =
            data.rightSponsor;

    }

}


/* =========================================================
   LIVE FIREBASE LISTENER
   ========================================================= */

matchRef.on("value", snapshot => {

    if(snapshot.exists()){

        render(snapshot.val());

    }

});

</script>

</body>
</html>
