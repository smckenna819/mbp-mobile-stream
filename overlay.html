<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBP Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:white}.stage{position:relative;width:100vw;height:100vh}.top{position:absolute;top:2.2%;left:50%;transform:translateX(-50%);min-width:22%;max-width:70%;padding:.5% 1.4%;text-align:center;background:linear-gradient(180deg,rgba(28,28,32,.94),rgba(5,5,7,.92));border:2px solid rgba(255,255,255,.75);border-radius:14px;font-weight:800;font-size:1.45vw;letter-spacing:.06em;text-shadow:0 2px 4px #000;display:none}.board{position:absolute;left:50%;bottom:2.1%;transform:translateX(-50%);width:76%;height:11.8%;display:grid;grid-template-columns:1fr 10% 12% 10% 1fr;filter:drop-shadow(0 5px 9px rgba(0,0,0,.75))}.panel,.score,.brand{background:linear-gradient(180deg,rgba(35,36,42,.96),rgba(7,8,11,.96));border-top:2px solid #d7d7d7;border-bottom:2px solid #7e7e7e}.panel{padding:1.1% 4%;display:flex;flex-direction:column;justify-content:center}.left{border-left:2px solid #aaa;border-radius:14px 0 0 14px}.right{border-right:2px solid #aaa;border-radius:0 14px 14px 0;text-align:right}.name{font-size:2.15vw;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:1.05vw;font-weight:700;color:#d6d6d6;margin-top:.2em;letter-spacing:.06em}.score{display:flex;align-items:center;justify-content:center;font-size:4.1vw;font-weight:900;border-left:1px solid #777;border-right:1px solid #777}.brand{display:flex;align-items:center;justify-content:center;padding:7%;}.brand img{max-width:100%;max-height:100%;object-fit:contain}.onepocket{position:absolute;left:50%;bottom:14.35%;transform:translateX(-50%);width:36%;height:5.3%;display:none;grid-template-columns:1fr 1fr;background:rgba(8,9,12,.95);border:2px solid #aaa;border-radius:12px;overflow:hidden;box-shadow:0 5px 10px rgba(0,0,0,.6)}.ball{display:flex;align-items:center;justify-content:center;font-size:1.45vw;font-weight:900}.ball:first-child{border-right:1px solid #777}.ball span{font-size:2vw;margin-left:.55em}.hidden{display:none!important}
</style></head><body><div class="stage" id="stage"><div class="top" id="info"></div><div class="onepocket" id="op"><div class="ball">P1 BALLS <span id="b1">0</span></div><div class="ball">P2 BALLS <span id="b2">0</span></div></div><div class="board"><div class="panel left"><div class="name" id="p1">PLAYER ONE</div><div class="meta" id="m1">RACE TO 5</div></div><div class="score" id="s1">0</div><div class="brand"><img src="assets/mbp-logo.png"></div><div class="score" id="s2">0</div><div class="panel right"><div class="name" id="p2">PLAYER TWO</div><div class="meta" id="m2">RACE TO 5</div></div></div></div><script src="config.js"></script><script src="shared.js"></script><script>
function render(s){document.getElementById('p1').textContent=s.p1;document.getElementById('p2').textContent=s.p2;document.getElementById('s1').textContent=s.score1;document.getElementById('s2').textContent=s.score2;document.getElementById('b1').textContent=s.balls1;document.getElementById('b2').textContent=s.balls2;const op=s.game==='One Pocket';document.getElementById('op').style.display=op?'grid':'none';document.getElementById('m1').textContent=(op?'GAMES ':'RACE TO ')+s.race1;document.getElementById('m2').textContent=(op?'GAMES ':'RACE TO ')+s.race2;const i=document.getElementById('info');i.textContent=s.info||'';i.style.display=s.info?'block':'none';document.getElementById('stage').style.display=s.visible?'block':'none'} initSync(render);
</script></body></html>
