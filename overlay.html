<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBP Overlay</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

.stage{
    position:relative;
    width:100vw;
    height:100vh;
}

/* =========================================================
   COMPLETE SCOREBOARD
   ========================================================= */

.scoreboard{
    position:absolute;
    left:50%;
    bottom:3.2vh;
    transform:translateX(-50%);
    width:97vw;
    height:15.3vh;
    filter:drop-shadow(0 8px 8px rgba(0,0,0,.70));
}

/* =========================================================
   MAIN UPPER BAR
   ========================================================= */

.mainbar{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:12.2vh;
    display:grid;

    grid-template-columns:
        14.5%
        21.5%
        7.2%
        12.6%
        7.2%
        21.5%
        14.5%;

    align-items:stretch;
}

/* =========================================================
   SPONSOR BOXES
   ========================================================= */

.sponsor{
    position:relative;
    background:
        linear-gradient(180deg,#202328 0%,#08090b 58%,#15171a 100%);
    border:2px solid #96999e;
    overflow:hidden;
    z-index:3;
}

.sponsor.leftSponsor{
    border-radius:13px 0 0 13px;
    clip-path:polygon(
        0 0,
        87% 0,
        100% 100%,
        0 100%
    );
    padding-right:10%;
}

.sponsor.rightSponsor{
    border-radius:0 13px 13px 0;
    clip-path:polygon(
        13% 0,
        100% 0,
        100% 100%,
        0 100%
    );
    padding-left:10%;
}

.sponsorInner{
    position:absolute;
    inset:8%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.sponsor img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

/* =========================================================
   PLAYER PANELS
   ========================================================= */

.player{
    position:relative;
    background:
        linear-gradient(180deg,#121419 0%,#08090c 100%);
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
}

.player.leftPlayer{
    padding:0 4% 0 8%;
    border-left:9px solid #0785ff;
}

.player.rightPlayer{
    padding:0 8% 0 4%;
    text-align:right;
    border-right:9px solid #ff2028;
}

.player.leftPlayer:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:9px;
    height:100%;
    background:linear-gradient(180deg,#28a7ff,#0067df);
    box-shadow:0 0 10px rgba(0,132,255,.65);
}

.player.rightPlayer:after{
    content:"";
    position:absolute;
    right:0;
    top:0;
    width:9px;
    height:100%;
    background:linear-gradient(180deg,#ff3c43,#d8000b);
    box-shadow:0 0 10px rgba(255,0,0,.60);
}

.playerName{
    font-size:2.05vw;
    line-height:1;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:0 3px 4px #000;
}

.playerBottom{
    margin-top:.65vh;
    min-height:2.2vh;
    display:flex;
    align-items:center;
    gap:.75vw;
}

.rightPlayer .playerBottom{
    justify-content:flex-end;
}

.fargo{
    font-size:1.16vw;
    color:#ddd;
    white-space:nowrap;
}

.breakBadge{
    display:none;
    align-items:center;
    justify-content:center;

    padding:.2vh .65vw;

    background:
        linear-gradient(180deg,#ff2530,#cf0009);

    border-left:4px solid #ff2932;
    border-right:4px solid #ff2932;

    transform:skew(-13deg);

    box-shadow:
        0 0 8px rgba(255,0,0,.45);

    font-size:1.05vw;
    font-weight:900;
    line-height:1.3;
}

.breakBadge span{
    display:block;
    transform:skew(13deg);
}

/* =========================================================
   SCORE PODS
   ========================================================= */

.scoreWrap{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#08090c;
}

.scorePod{
    position:relative;
    width:74%;
    height:78%;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(180deg,#17191e 0%,#090a0d 100%);

    transform:skew(-9deg);

    box-shadow:
        inset 0 0 15px rgba(255,255,255,.03),
        0 4px 8px rgba(0,0,0,.8);
}

.scoreWrap.blue .scorePod{
    border-top:4px solid #078bff;
    border-bottom:4px solid #078bff;
    box-shadow:
        inset 0 0 14px rgba(0,130,255,.10),
        0 0 10px rgba(0,125,255,.25);
}

.scoreWrap.red .scorePod{
    border-top:4px solid #ff1724;
    border-bottom:4px solid #ff1724;
    box-shadow:
        inset 0 0 14px rgba(255,0,0,.10),
        0 0 10px rgba(255,0,0,.25);
}

.scoreNumber{
    transform:skew(9deg);
    font-size:4.3vw;
    line-height:1;
    font-weight:900;
    text-shadow:0 3px 5px #000;
}

/* =========================================================
   CENTER MBP SECTION
   ========================================================= */

.brand{
    position:relative;
    background:
        linear-gradient(180deg,#090a0d 0%,#030304 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:.5vh .6vw;
    overflow:hidden;
}

.brand:before,
.brand:after{
    content:"";
    position:absolute;
    top:13%;
    width:1px;
    height:74%;
    background:#3c3f44;
}

.brand:before{
    left:0;
}

.brand:after{
    right:0;
}

.brand img{
    display:block;
    max-width:95%;
    max-height:94%;
    object-fit:contain;
}

/* =========================================================
   LOWER MATCH INFORMATION BAR
   ========================================================= */

.matchbar{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:11.55vh;

    width:44%;
    height:3.65vh;

    background:
        linear-gradient(180deg,#17191d,#07080a);

    clip-path:polygon(
        2% 0,
        98% 0,
        96% 100%,
        4% 100%
    );

    border-top:2px solid #777;

    display:grid;
    grid-template-columns:1fr 1px 1.55fr 1px 1fr;
    align-items:center;

    box-shadow:0 6px 8px rgba(0,0,0,.75);
    z-index:10;
}

.matchItem{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.45vw;

    font-size:.95vw;
    font-weight:900;
    white-space:nowrap;
}

.divider{
    height:48%;
    background:#aaa;
}

.ballIcon{
    width:1.55vw;
    height:1.55vw;
    min-width:1.55vw;
    border-radius:50%;

    background:
        radial-gradient(circle at 35% 30%,#fff 0 16%,#f3cf26 17% 68%,#b68b00 69% 100%);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#111;
    font-size:.72vw;
    font-weight:900;

    box-shadow:
        inset -2px -2px 4px rgba(0,0,0,.35),
        0 1px 3px #000;
}

/* blue/red decorative slashes */

.matchbar:before{
    content:"";
    position:absolute;
    left:1.5%;
    top:0;
    width:1.2%;
    height:100%;
    background:#0787ff;
    transform:skew(-17deg);
}

.matchbar:after{
    content:"";
    position:absolute;
    right:1.5%;
    top:0;
    width:1.2%;
    height:100%;
    background:#f20d1b;
    transform:skew(-17deg);
}

/* =========================================================
   ONE POCKET BALL COUNTS
   ========================================================= */

.onePocket{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:15.8vh;

    width:30vw;
    height:4.3vh;

    display:none;
    grid-template-columns:1fr 1fr;

    background:linear-gradient(180deg,#17191d,#08090b);
    border:1px solid #888;
    border-radius:8px;

    overflow:hidden;
}

.ballCount{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.5vw;

    font-size:1vw;
    font-weight:800;
}

.ballCount:first-child{
    border-right:1px solid #666;
}

.ballCount strong{
    font-size:1.45vw;
}

/* =========================================================
   OPTIONAL TOP INFORMATION
   ========================================================= */

.topInfo{
    position:absolute;
    left:50%;
    top:3vh;
    transform:translateX(-50%);

    display:none;

    background:rgba(8,9,12,.94);
    border:1px solid #888;
    border-radius:8px;

    padding:.6vh 1.2vw;

    font-size:1.15vw;
    font-weight:800;
}

/* =========================================================
   RESPONSIVE SAFETY
   ========================================================= */

.hidden{
    display:none !important;
}

/* ===== CONCEPT IMAGE PROPORTION OVERRIDES ===== */

.scoreboard{
    left:50%;
    bottom:2.5vh;
    transform:translateX(-50%);
    width:98vw;
    height:17vh;
    max-height:185px;
    min-height:145px;
}

/* Main scoreboard bar */
.mainbar{
    height:13.2vh;
    max-height:145px;
    min-height:112px;
}

/* Sponsor boxes - larger like concept */
.sponsor{
    width:14.5%;
}

.sponsorInner{
    width:100%;
    height:100%;
    padding:8px 14px;
}

.sponsor img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

/* Player sections */
.player{
    width:23%;
}

.playerName{
    font-size:1.75vw;
    font-weight:900;
    letter-spacing:.01em;
}

.playerBottom{
    margin-top:.35vh;
}

.fargo{
    font-size:1.18vw;
}

/* BREAK badge */
.breakBadge{
    font-size:1.15vw;
    font-weight:900;
    padding:.25vh .8vw;
}

/* Scores */
.scoreBox{
    width:7.5%;
}

.score{
    font-size:4vw;
    font-weight:900;
}

/* Center MBP logo */
.centerBrand{
    width:11%;
    padding:.6vh .7vw;
}

.centerBrand img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* Bottom information bar */
.bottomBar{
    height:4.3vh;
    min-height:38px;
    max-height:48px;
    width:46%;
    left:50%;
    transform:translateX(-50%);
}

.bottomItem{
    font-size:1.05vw;
    font-weight:900;
}

/* Make everything fill the bar vertically */
.mainbar,
.player,
.scoreBox,
.centerBrand,
.sponsor{
    height:100%;
}
</style>
</head>

<body>

<div class="stage" id="stage">

    <div class="topInfo" id="info"></div>

    <div class="onePocket" id="op">
        <div class="ballCount">
            P1 BALLS
            <strong id="b1">0</strong>
        </div>

        <div class="ballCount">
            P2 BALLS
            <strong id="b2">0</strong>
        </div>
    </div>

    <div class="scoreboard">

        <div class="mainbar">

            <!-- LEFT SPONSOR -->
            <div class="sponsor leftSponsor">
                <div class="sponsorInner">
                    <img id="leftSponsor" src="">
                </div>
            </div>

            <!-- PLAYER ONE -->
            <div class="player leftPlayer">

                <div class="playerName" id="p1">
                    PLAYER ONE
                </div>

                <div class="playerBottom">

                    <div class="breakBadge" id="break1">
                        <span>BREAK</span>
                    </div>

                    <div class="fargo">
                        Fargo <span id="fargo1">620</span>
                    </div>

                </div>

            </div>

            <!-- SCORE ONE -->
            <div class="scoreWrap blue">
                <div class="scorePod">
                    <div class="scoreNumber" id="s1">0</div>
                </div>
            </div>

            <!-- MBP -->
            <div class="brand">
                <img src="mbp-logo.png" alt="McKenna Billiard Productions">
            </div>

            <!-- SCORE TWO -->
            <div class="scoreWrap red">
                <div class="scorePod">
                    <div class="scoreNumber" id="s2">0</div>
                </div>
            </div>

            <!-- PLAYER TWO -->
            <div class="player rightPlayer">

                <div class="playerName" id="p2">
                    PLAYER TWO
                </div>

                <div class="playerBottom">

                    <div class="fargo">
                        Fargo <span id="fargo2">598</span>
                    </div>

                    <div class="breakBadge" id="break2">
                        <span>BREAK</span>
                    </div>

                </div>

            </div>

            <!-- RIGHT SPONSOR -->
            <div class="sponsor rightSponsor">
                <div class="sponsorInner">
                    <img id="rightSponsor" src="">
                </div>
            </div>

        </div>

        <!-- LOWER BAR -->

        <div class="matchbar">

            <div class="matchItem">
                <div class="ballIcon" id="ballIcon">9</div>
                <span id="gameType">9-BALL</span>
            </div>

            <div class="divider"></div>

            <div class="matchItem" id="format">
                SCOTCH DOUBLES
            </div>

            <div class="divider"></div>

            <div class="matchItem" id="race">
                RACE TO 5
            </div>

        </div>

    </div>

</div>

<script src="config.js"></script>
<script src="shared.js"></script>

<script>

function value(v,fallback){
    return (v === undefined || v === null || v === "")
        ? fallback
        : v;
}

function render(s){

    /* PLAYERS */

    document.getElementById("p1").textContent =
        value(s.p1,"PLAYER ONE");

    document.getElementById("p2").textContent =
        value(s.p2,"PLAYER TWO");


    /* SCORES */

    document.getElementById("s1").textContent =
        value(s.score1,0);

    document.getElementById("s2").textContent =
        value(s.score2,0);


    /* FARGO */

    document.getElementById("fargo1").textContent =
        value(s.fargo1,620);

    document.getElementById("fargo2").textContent =
        value(s.fargo2,598);


    /* GAME TYPE */

    const game = value(s.game,"9-Ball");

    document.getElementById("gameType").textContent =
        game.toUpperCase();


    /* BALL ICON */

    let ballNumber = "9";

    if(game.toLowerCase().includes("8")){
        ballNumber = "8";
    }

    if(game.toLowerCase().includes("10")){
        ballNumber = "10";
    }

    if(game.toLowerCase().includes("one")){
        ballNumber = "1";
    }

    document.getElementById("ballIcon").textContent =
        ballNumber;


    /* FORMAT */

    document.getElementById("format").textContent =
        value(
            s.format || s.matchType,
            "SCOTCH DOUBLES"
        ).toUpperCase();


    /* RACE */

    const race =
        value(s.race1,s.race);

    document.getElementById("race").textContent =
        game === "One Pocket"
        ? "ONE POCKET"
        : "RACE TO " + value(race,5);


    /* BREAK INDICATOR */

    const break1 =
        document.getElementById("break1");

    const break2 =
        document.getElementById("break2");

    break1.style.display = "none";
    break2.style.display = "none";

    const breaker =
        s.breaker || s.break || s.breakPlayer;

    if(
        breaker === 1 ||
        breaker === "1" ||
        breaker === "p1" ||
        breaker === "P1"
    ){
        break1.style.display = "flex";
    }

    if(
        breaker === 2 ||
        breaker === "2" ||
        breaker === "p2" ||
        breaker === "P2"
    ){
        break2.style.display = "flex";
    }


    /* ONE POCKET */

    const onePocket =
        game.toLowerCase().includes("one pocket");

    document.getElementById("op").style.display =
        onePocket ? "grid" : "none";

    document.getElementById("b1").textContent =
        value(s.balls1,0);

    document.getElementById("b2").textContent =
        value(s.balls2,0);


    /* TOP INFORMATION */

    const info =
        document.getElementById("info");

    info.textContent =
        value(s.info,"");

    info.style.display =
        s.info ? "block" : "none";


    /* SPONSOR LOGOS */

    const left =
        document.getElementById("leftSponsor");

    const right =
        document.getElementById("rightSponsor");

    if(s.leftSponsor){
        left.src = s.leftSponsor;
    }

    if(s.rightSponsor){
        right.src = s.rightSponsor;
    }


    /* OVERLAY VISIBILITY */

    document.getElementById("stage").style.display =
        s.visible === false
        ? "none"
        : "block";
}


/* CONNECT TO EXISTING SYNC SYSTEM */

if(typeof initSync === "function"){
    initSync(render);
}else{

    /* Preview values if sync isn't available */

    render({
        p1:"SHAWN MCKENNA",
        p2:"CHRIS LAWSON",

        score1:0,
        score2:0,

        fargo1:620,
        fargo2:598,

        game:"9-Ball",

        format:"SCOTCH DOUBLES",

        race1:5,

        breaker:1,

        visible:true
    });
}

</script>

</body>
</html>
