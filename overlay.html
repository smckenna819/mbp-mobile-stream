<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBP Overlay</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

.stage{
    position:relative;
    width:100vw;
    height:100vh;
}

/* ==============================
   COMPLETE SCOREBOARD
   ============================== */

.scoreboard{
    position:absolute;
    left:50%;
    bottom:5%;
    transform:translateX(-50%);
    width:96%;
    height:145px;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.85));
}

/* MAIN ROW */

.main-row{
    position:absolute;
    left:0;
    bottom:30px;
    width:100%;
    height:115px;

    display:grid;

    grid-template-columns:
        13%
        24%
        8%
        10%
        8%
        24%
        13%;
}


/* ==============================
   SPONSORS
   ============================== */

.sponsor{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            180deg,
            rgba(30,32,37,.98),
            rgba(5,6,8,.98)
        );

    border:2px solid #8a8d92;

    overflow:hidden;
}

.sponsor-left{
    border-radius:14px 0 0 14px;
}

.sponsor-right{
    border-radius:0 14px 14px 0;
}

.sponsor img{
    width:90%;
    height:88%;
    object-fit:contain;
}


/* ==============================
   PLAYER PANELS
   ============================== */

.player{
    position:relative;

    display:flex;
    flex-direction:column;
    justify-content:center;

    background:
        linear-gradient(
            180deg,
            rgba(29,31,36,.98),
            rgba(6,7,9,.98)
        );

    padding:12px 28px;
}

.player-left{
    border-left:5px solid #087dff;
}

.player-right{
    border-right:5px solid #ff2028;
    text-align:right;
}

.player-left:before{
    content:"";
    position:absolute;
    left:0;
    bottom:0;

    width:16px;
    height:100%;

    background:
        linear-gradient(
            180deg,
            #178cff,
            #004bd0
        );

    clip-path:polygon(
        0 0,
        100% 0,
        35% 100%,
        0 100%
    );
}

.player-right:after{
    content:"";
    position:absolute;
    right:0;
    bottom:0;

    width:16px;
    height:100%;

    background:
        linear-gradient(
            180deg,
            #ff252d,
            #c4000a
        );

    clip-path:polygon(
        65% 0,
        100% 0,
        100% 100%,
        0 100%
    );
}

.name{
    font-size:31px;
    line-height:1;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    text-shadow:
        0 2px 3px black;
}

.player-info{
    display:flex;
    align-items:center;
    gap:12px;

    margin-top:12px;

    font-size:19px;
}

.player-right .player-info{
    justify-content:flex-end;
}


/* ==============================
   BREAK INDICATOR
   ============================== */

.break{
    display:none;

    padding:4px 13px;

    font-weight:900;
    font-size:16px;

    font-style:italic;

    background:#e3131b;

    transform:skew(-12deg);

    border-left:4px solid #ff3c43;
    border-right:4px solid #ff3c43;

    text-shadow:0 2px 2px black;
}

.break span{
    display:block;
    transform:skew(12deg);
}

.break.blue{
    background:#086de0;
    border-color:#2095ff;
}


/* ==============================
   SCORES
   ============================== */

.score-wrap{
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            180deg,
            #17191e,
            #050608
        );
}

.score-box{
    width:82%;
    height:80%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:58px;
    font-weight:900;

    background:
        linear-gradient(
            180deg,
            #1b1d21,
            #08090b
        );

    clip-path:polygon(
        14% 0,
        100% 0,
        86% 100%,
        0 100%
    );

    text-shadow:
        0 3px 4px black;
}

.score-left{
    border-bottom:5px solid #087cff;
}

.score-right{
    border-bottom:5px solid #f01822;
}


/* ==============================
   CENTER MBP LOGO
   ============================== */

.brand{
    display:flex;
    align-items:center;
    justify-content:center;

    padding:8px;

    background:
        linear-gradient(
            180deg,
            #111216,
            #020304
        );
}

.brand img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}


/* ==============================
   LOWER MATCH INFORMATION BAR
   ============================== */

.match-bar{
    position:absolute;

    left:26%;
    bottom:0;

    width:48%;
    height:38px;

    display:grid;
    grid-template-columns:1fr 1.6fr 1fr;

    background:
        linear-gradient(
            180deg,
            #181a1e,
            #050607
        );

    border-top:2px solid #777;

    clip-path:polygon(
        2% 0,
        98% 0,
        96% 100%,
        4% 100%
    );

    font-size:18px;
    font-weight:700;
}

.match-cell{
    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

.match-cell:not(:last-child):after{
    content:"";
    position:absolute;

    right:0;

    height:55%;
    width:2px;

    background:#aaa;
}

.game{
    font-weight:900;
}

.ball-icon{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    width:26px;
    height:26px;

    margin-right:8px;

    border-radius:50%;

    background:#f0c52c;
    color:black;

    font-size:13px;
    font-weight:900;

    border:2px solid white;
}


/* ==============================
   ONE POCKET BALL COUNTERS
   ============================== */

.one-pocket{
    display:none;

    position:absolute;

    left:50%;
    bottom:151px;

    transform:translateX(-50%);

    height:42px;
    min-width:350px;

    grid-template-columns:1fr 1fr;

    background:
        linear-gradient(
            180deg,
            #1b1d22,
            #050607
        );

    border:2px solid #888;
    border-radius:8px;

    overflow:hidden;
}

.ball-count{
    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 20px;

    font-weight:900;
    font-size:17px;
}

.ball-count:first-child{
    border-right:1px solid #777;
}

.ball-number{
    font-size:25px;
    margin-left:12px;
}


/* hide entire overlay */

.hidden{
    display:none !important;
}

</style>
</head>

<body>

<div class="stage" id="stage">

    <!-- ONE POCKET COUNTER -->

    <div class="one-pocket" id="onePocket">

        <div class="ball-count">
            P1 BALLS
            <span class="ball-number" id="balls1">0</span>
        </div>

        <div class="ball-count">
            P2 BALLS
            <span class="ball-number" id="balls2">0</span>
        </div>

    </div>


    <!-- SCOREBOARD -->

    <div class="scoreboard">

        <div class="main-row">

            <!-- LEFT SPONSOR -->

            <div class="sponsor sponsor-left">
                <img
                    id="sponsorLeft"
                    src="assets/sponsor-left.png"
                    alt=""
                >
            </div>


            <!-- PLAYER ONE -->

            <div class="player player-left">

                <div
                    class="name"
                    id="player1"
                >
                    PLAYER ONE
                </div>

                <div class="player-info">

                    <div
                        class="break blue"
                        id="break1"
                    >
                        <span>BREAK</span>
                    </div>

                    <div id="fargo1">
                        Fargo 620
                    </div>

                </div>

            </div>


            <!-- SCORE ONE -->

            <div class="score-wrap">

                <div
                    class="score-box score-left"
                    id="score1"
                >
                    0
                </div>

            </div>


            <!-- MBP LOGO -->

            <div class="brand">

                <img
                    src="assets/mbp-logo.png"
                    alt="McKenna Billiard Productions"
                >

            </div>


            <!-- SCORE TWO -->

            <div class="score-wrap">

                <div
                    class="score-box score-right"
                    id="score2"
                >
                    0
                </div>

            </div>


            <!-- PLAYER TWO -->

            <div class="player player-right">

                <div
                    class="name"
                    id="player2"
                >
                    PLAYER TWO
                </div>

                <div class="player-info">

                    <div id="fargo2">
                        Fargo 598
                    </div>

                    <div
                        class="break"
                        id="break2"
                    >
                        <span>BREAK</span>
                    </div>

                </div>

            </div>


            <!-- RIGHT SPONSOR -->

            <div class="sponsor sponsor-right">

                <img
                    id="sponsorRight"
                    src="assets/sponsor-right.png"
                    alt=""
                >

            </div>

        </div>


        <!-- MATCH INFORMATION -->

        <div class="match-bar">

            <div class="match-cell game">

                <span
                    class="ball-icon"
                    id="ballIcon"
                >
                    9
                </span>

                <span id="gameType">
                    9-BALL
                </span>

            </div>


            <div
                class="match-cell"
                id="matchType"
            >
                SCOTCH DOUBLES
            </div>


            <div
                class="match-cell"
                id="race"
            >
                RACE TO 5
            </div>

        </div>

    </div>

</div>


<script src="config.js"></script>
<script src="shared.js"></script>

<script>

function render(s){

    /* PLAYER NAMES */

    document.getElementById("player1").textContent =
        s.p1 || "PLAYER ONE";

    document.getElementById("player2").textContent =
        s.p2 || "PLAYER TWO";


    /* SCORES */

    document.getElementById("score1").textContent =
        s.score1 ?? 0;

    document.getElementById("score2").textContent =
        s.score2 ?? 0;


    /* FARGO */

    document.getElementById("fargo1").textContent =
        s.fargo1
        ? "Fargo " + s.fargo1
        : "";

    document.getElementById("fargo2").textContent =
        s.fargo2
        ? "Fargo " + s.fargo2
        : "";


    /* GAME TYPE */

    const game =
        s.game || "9-Ball";

    document.getElementById("gameType").textContent =
        game.toUpperCase();

    const icon =
        document.getElementById("ballIcon");

    if(game === "8-Ball"){
        icon.textContent = "8";
    }
    else if(game === "9-Ball"){
        icon.textContent = "9";
    }
    else if(game === "10-Ball"){
        icon.textContent = "10";
    }
    else{
        icon.textContent = "●";
    }


    /* MATCH TYPE */

    document.getElementById("matchType").textContent =
        s.matchType ||
        "SCOTCH DOUBLES";


    /* RACE */

    document.getElementById("race").textContent =
        "RACE TO " +
        (s.race1 || 5);


    /* BREAK */

    document.getElementById("break1").style.display =
        s.breakPlayer === 1
        ? "block"
        : "none";

    document.getElementById("break2").style.display =
        s.breakPlayer === 2
        ? "block"
        : "none";


    /* ONE POCKET */

    const onePocket =
        game === "One Pocket";

    document.getElementById("onePocket").style.display =
        onePocket
        ? "grid"
        : "none";

    document.getElementById("balls1").textContent =
        s.balls1 ?? 0;

    document.getElementById("balls2").textContent =
        s.balls2 ?? 0;


    /* OVERLAY VISIBILITY */

    document.getElementById("stage").style.display =
        s.visible === false
        ? "none"
        : "block";
}


initSync(render);

</script>

</body>
</html>
