<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MBP Overlay</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

/* =========================================================
   SCOREBOARD — LOCKED
   ========================================================= */

#scoreboard {
    position: absolute;
    left: 0;
    top: 737px;
    width: 1920px;
    height: 325px;
}

/* =========================================================
   SCOREBOARD SHELL — LOCKED
   ========================================================= */

#shell {
    position: absolute;
    left: 0;
    top: -405px;
    width: 1920px;
    height: 1080px;
    z-index: 1;
    pointer-events: none;
}

/* =========================================================
   SPONSOR LOGOS
   ONLY NEW ELEMENTS IN THIS VERSION
   ========================================================= */

.sponsor {
    position: absolute;
    top: 66px;
    width: 235px;
    height: 132px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 4;
    overflow: hidden;
}

#leftSponsor {
    left: 95px;
}

#rightSponsor {
    right: 95px;
}

.sponsor img {
    display: block;
    max-width: 90%;
    max-height: 88%;
    width: auto;
    height: auto;
    object-fit: contain;
}

/* =========================================================
   PLAYER 1 — LOCKED
   ========================================================= */

#player1 {
    position: absolute;
    left: 330px;
    top: 95px;
    width: 360px;
    height: 145px;
    z-index: 5;
}

#player1Name {
    position: absolute;
    left: 24px;
    top: 48px;
    width: 330px;
    height: 32px;

    font-size: 28px;
    line-height: 32px;
    font-weight: 800;

    white-space: nowrap;
    overflow: visible;
}

#player1Info {
    position: absolute;
    left: 44px;
    top: 105px;
    width: 298px;
    height: 25px;

    display: flex;
    align-items: center;
    gap: 13px;

    font-size: 19px;
    line-height: 25px;
    font-weight: 400;

    white-space: nowrap;
}

/* =========================================================
   PLAYER 2 — LOCKED
   ========================================================= */

#player2 {
    position: absolute;
    right: 330px;
    top: 95px;
    width: 360px;
    height: 145px;
    z-index: 5;
}

#player2Name {
    position: absolute;
    right: 24px;
    top: 48px;
    width: 330px;
    height: 32px;

    text-align: right;

    font-size: 28px;
    line-height: 32px;
    font-weight: 800;

    white-space: nowrap;
    overflow: visible;
}

#player2Info {
    position: absolute;
    right: 44px;
    top: 105px;
    width: 298px;
    height: 25px;

    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 13px;

    font-size: 19px;
    line-height: 25px;
    font-weight: 400;

    white-space: nowrap;
}

/* =========================================================
   BREAK INDICATOR
   Travels with FargoRate row
   ========================================================= */

.breakIndicator {
    display: none;

    padding: 1px 8px;
    height: 23px;

    align-items: center;
    justify-content: center;

    background: #e31b23;
    border-radius: 3px;

    color: white;
    font-size: 14px;
    line-height: 21px;
    font-weight: 900;
    letter-spacing: 0.5px;

    white-space: nowrap;
}

.breakIndicator.active {
    display: inline-flex;
}

/* =========================================================
   SCORES — LOCKED
   ========================================================= */

.score {
    position: absolute;
    width: 102px;
    height: 112px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 61px;
    line-height: 1;
    font-weight: 900;

    text-align: center;
    z-index: 6;
}

#score1 {
    left: 696px;
    top: 110px;
}

#score2 {
    right: 701px;
    top: 110px;
}

/* =========================================================
   MBP LOGO — LOCKED
   ========================================================= */

#mbpLogo {
    position: absolute;
    left: 50%;
    top: 53px;

    width: 230px;
    height: 125px;

    transform: translateX(-50%);

    object-fit: contain;
    z-index: 5;
}

/* =========================================================
   LOWER INFORMATION BAR — LOCKED
   ========================================================= */

.lowerItem {
    position: absolute;
    top: 261px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
    line-height: 40px;
    font-weight: 800;

    text-align: center;
    white-space: nowrap;

    z-index: 5;
}

#race1Box {
    left: 540px;
    width: 245px;
}

#gameBox {
    left: 785px;
    width: 350px;
}

#race2Box {
    left: 1135px;
    width: 245px;
}

/* =========================================================
   LOWER BAR HASH LINES — LOCKED
   ========================================================= */

.lowerDivider {
    position: absolute;
    top: 270px;

    width: 2px;
    height: 22px;

    background: rgba(255,255,255,0.85);

    z-index: 6;
}

#divider1 {
    left: 800px;
}

#divider2 {
    left: 1120px;
}

</style>
</head>

<body>

<div id="scoreboard">

    <!-- SCOREBOARD SHELL -->
    <img
        id="shell"
        src="scoreboard-shell.png"
        alt=""
    >

    <!-- LEFT SPONSOR -->
    <div id="leftSponsor" class="sponsor">
        <img src="mr-gs-logo.png" alt="Left Sponsor">
    </div>

    <!-- RIGHT SPONSOR -->
    <div id="rightSponsor" class="sponsor">
        <img src="mr-gs-logo.png" alt="Right Sponsor">
    </div>

    <!-- PLAYER 1 -->
    <div id="player1">

        <div id="player1Name">
            PLAYER ONE
        </div>

        <div id="player1Info">

            <span id="player1Fargo">
                FargoRate
            </span>

            <span
                id="break1"
                class="breakIndicator"
            >
                BREAK
            </span>

        </div>

    </div>

    <!-- PLAYER 1 SCORE -->
    <div id="score1" class="score">
        0
    </div>

    <!-- CENTER MBP LOGO -->
    <img
        id="mbpLogo"
        src="mbp-logo.png"
        alt="MBP"
    >

    <!-- PLAYER 2 SCORE -->
    <div id="score2" class="score">
        0
    </div>

    <!-- PLAYER 2 -->
    <div id="player2">

        <div id="player2Name">
            PLAYER TWO
        </div>

        <div id="player2Info">

            <span
                id="break2"
                class="breakIndicator"
            >
                BREAK
            </span>

            <span id="player2Fargo">
                FargoRate
            </span>

        </div>

    </div>

    <!-- LOWER BAR -->

    <div id="race1Box" class="lowerItem">
        RACE TO 5
    </div>

    <div id="divider1" class="lowerDivider"></div>

    <div id="gameBox" class="lowerItem">
        9-BALL
    </div>

    <div id="divider2" class="lowerDivider"></div>

    <div id="race2Box" class="lowerItem">
        RACE TO 5
    </div>

</div>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>

<script>

firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const matchRef = database.ref("match");


/* =========================================================
   ELEMENTS
   ========================================================= */

const player1Name =
    document.getElementById("player1Name");

const player2Name =
    document.getElementById("player2Name");

const player1Fargo =
    document.getElementById("player1Fargo");

const player2Fargo =
    document.getElementById("player2Fargo");

const score1 =
    document.getElementById("score1");

const score2 =
    document.getElementById("score2");

const race1Box =
    document.getElementById("race1Box");

const race2Box =
    document.getElementById("race2Box");

const gameBox =
    document.getElementById("gameBox");

const break1 =
    document.getElementById("break1");

const break2 =
    document.getElementById("break2");


/* =========================================================
   GAME NAME FORMAT
   ========================================================= */

function formatGame(game) {

    if (!game) {
        return "9-BALL";
    }

    const value =
        String(game).trim().toUpperCase();

    if (value === "9-BALL" || value === "9 BALL") {
        return "9-BALL";
    }

    if (value === "8-BALL" || value === "8 BALL") {
        return "8-BALL";
    }

    if (value === "10-BALL" || value === "10 BALL") {
        return "10-BALL";
    }

    if (value === "ONE POCKET") {
        return "ONE POCKET";
    }

    if (value === "BANKS") {
        return "BANKS";
    }

    return value;
}


/* =========================================================
   BREAK INDICATOR
   ========================================================= */

function updateBreaker(data) {

    break1.classList.remove("active");
    break2.classList.remove("active");

    const breaker =
        data.breaker ??
        data.breakPlayer ??
        data.break ??
        "";

    const value =
        String(breaker).toLowerCase();

    if (
        value === "1" ||
        value === "player1" ||
        value === "player 1" ||
        value === "left"
    ) {

        break1.classList.add("active");

    }

    if (
        value === "2" ||
        value === "player2" ||
        value === "player 2" ||
        value === "right"
    ) {

        break2.classList.add("active");

    }

}


/* =========================================================
   LIVE FIREBASE DATA
   ========================================================= */

matchRef.on("value", snapshot => {

    const data =
        snapshot.val() || {};

    const p1 =
        data.player1 || {};

    const p2 =
        data.player2 || {};


    /* PLAYER NAMES */

    player1Name.textContent =
        p1.name || "PLAYER ONE";

    player2Name.textContent =
        p2.name || "PLAYER TWO";


    /* FARGORATES */

    player1Fargo.textContent =
        p1.fargo !== undefined &&
        p1.fargo !== ""
            ? "FargoRate " + p1.fargo
            : "FargoRate";

    player2Fargo.textContent =
        p2.fargo !== undefined &&
        p2.fargo !== ""
            ? "FargoRate " + p2.fargo
            : "FargoRate";


    /* SCORES */

    score1.textContent =
        p1.score !== undefined
            ? p1.score
            : 0;

    score2.textContent =
        p2.score !== undefined
            ? p2.score
            : 0;


    /* GAME */

    gameBox.textContent =
        formatGame(data.game);


    /*
       CURRENT CONTROLLER STILL USES ONE RACE VALUE.

       Until we update control.html,
       both sides intentionally use data.race.

       Later these become:
       data.race1
       data.race2
    */

    const currentRace =
        data.race || 5;

    const race1 =
        data.race1 ??
        currentRace;

    const race2 =
        data.race2 ??
        currentRace;

    race1Box.textContent =
        "RACE TO " + race1;

    race2Box.textContent =
        "RACE TO " + race2;


    /* BREAK */

    updateBreaker(data);

});

</script>

</body>
</html>
