<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBP Overlay</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

/* =========================================================
   FIXED 1920x1080 OVERLAY CANVAS
   ========================================================= */

#canvas {
    position: absolute;
    width: 1920px;
    height: 1080px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
}

/* =========================================================
   SCOREBOARD
   Shell itself is a full 1920x1080 transparent PNG.
   ========================================================= */

#scoreboard {
    position: absolute;
    inset: 0;
}

#shell {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
}

/* =========================================================
   SPONSOR PANELS
   ========================================================= */

.sponsor {
    position: absolute;
    top: 455px;
    width: 245px;
    height: 145px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.sponsor.left {
    left: 25px;
}

.sponsor.right {
    right: 25px;
}

.sponsor img {
    max-width: 88%;
    max-height: 82%;
    object-fit: contain;
}

/* =========================================================
   PLAYER AREAS
   ========================================================= */

.player {
    position: absolute;
    top: 458px;
    width: 410px;
    height: 128px;
}

.player.left {
    left: 330px;
    text-align: left;
}

.player.right {
    right: 330px;
    text-align: right;
}

.playerName {
    position: absolute;
    top: 20px;
    width: 100%;

    font-size: 35px;
    line-height: 40px;
    font-weight: 900;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    text-shadow:
        0 2px 2px rgba(0,0,0,.9),
        0 0 5px rgba(0,0,0,.7);
}

.playerBottom {
    position: absolute;
    top: 70px;
    width: 100%;
    height: 42px;

    display: flex;
    align-items: center;
}

.player.left .playerBottom {
    justify-content: flex-start;
}

.player.right .playerBottom {
    justify-content: flex-end;
}

.fargo {
    font-size: 24px;
    font-weight: 500;
    color: #e8e8e8;
    white-space: nowrap;
}

/* =========================================================
   BREAK INDICATOR
   ========================================================= */

.break {
    display: none;
    align-items: center;
    justify-content: center;

    height: 36px;
    min-width: 115px;
    padding: 0 17px;
    margin-right: 16px;

    background: linear-gradient(
        180deg,
        #ff3138 0%,
        #e50914 50%,
        #b80008 100%
    );

    transform: skew(-12deg);

    border-left: 4px solid #ff3038;
    border-right: 4px solid #ff3038;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        0 2px 5px rgba(0,0,0,.65);
}

.break span {
    transform: skew(12deg);

    font-size: 22px;
    line-height: 1;
    font-weight: 900;
    font-style: italic;

    color: white;
}

.player.right .break {
    margin-right: 0;
    margin-left: 16px;
    order: 2;
}

.player.right .fargo {
    order: 1;
}

/* =========================================================
   SCORES
   ========================================================= */

.score {
    position: absolute;
    top: 462px;

    width: 100px;
    height: 120px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 66px;
    line-height: 1;
    font-weight: 900;

    text-shadow:
        0 3px 3px rgba(0,0,0,.9),
        0 0 6px rgba(0,0,0,.6);
}

#score1 {
    left: 747px;
}

#score2 {
    right: 747px;
}

/* =========================================================
   REAL MCKENNA BILLIARDS LOGO
   ========================================================= */

#mbpLogo {
    position: absolute;

    left: 50%;
    top: 450px;

    transform: translateX(-50%);

    width: 170px;
    height: 135px;

    object-fit: contain;
}

/* =========================================================
   LOWER INFORMATION BAR
   ========================================================= */

.bottomInfo {
    position: absolute;

    left: 50%;
    top: 602px;

    transform: translateX(-50%);

    width: 800px;
    height: 55px;

    display: grid;
    grid-template-columns: 1fr 1.35fr 1fr;

    align-items: center;

    font-weight: 900;
    text-transform: uppercase;

    pointer-events: none;
}

.infoCell {
    height: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    white-space: nowrap;
}

.infoCell + .infoCell {
    border-left: 2px solid rgba(255,255,255,.55);
}

#game {
    gap: 8px;
}

.ballIcon {
    display: inline-flex;

    width: 31px;
    height: 31px;

    border-radius: 50%;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff5a8 0%,
            #ffd32b 35%,
            #e1a800 72%,
            #9d7200 100%
        );

    border: 2px solid #f8dc45;

    color: #111;

    font-size: 16px;
    font-weight: 900;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.8),
        0 1px 3px rgba(0,0,0,.8);
}

/* =========================================================
   RESPONSIVE PREVIEW
   Keeps exact 1920x1080 geometry when browser isn't 1920x1080.
   ========================================================= */

@media (max-width: 1919px), (max-height: 1079px) {

    #canvas {
        transform:
            translate(-50%, -50%)
            scale(
                min(
                    calc(100vw / 1920),
                    calc(100vh / 1080)
                )
            );
    }
}
</style>
</head>

<body>

<div id="canvas">

    <div id="scoreboard">

        <!-- LOCKED SCOREBOARD ARTWORK -->
        <img
            id="shell"
            src="scoreboard-shell.png"
            alt=""
        >

        <!-- LEFT ROTATING SPONSOR -->
        <div class="sponsor left">
            <img id="leftSponsor" src="" alt="">
        </div>

        <!-- RIGHT ROTATING SPONSOR -->
        <div class="sponsor right">
            <img id="rightSponsor" src="" alt="">
        </div>

        <!-- PLAYER 1 -->
        <div class="player left">

            <div
                class="playerName"
                id="player1"
            >
                PLAYER ONE
            </div>

            <div class="playerBottom">

                <div
                    class="break"
                    id="break1"
                >
                    <span>BREAK</span>
                </div>

                <div
                    class="fargo"
                    id="fargo1"
                >
                    Fargo 620
                </div>

            </div>

        </div>

        <!-- PLAYER 1 SCORE -->
        <div
            class="score"
            id="score1"
        >
            0
        </div>

        <!-- REAL MBP LOGO -->
        <img
            id="mbpLogo"
            src="mbp-logo.png"
            alt="McKenna Billiard Productions"
        >

        <!-- PLAYER 2 SCORE -->
        <div
            class="score"
            id="score2"
        >
            0
        </div>

        <!-- PLAYER 2 -->
        <div class="player right">

            <div
                class="playerName"
                id="player2"
            >
                PLAYER TWO
            </div>

            <div class="playerBottom">

                <div
                    class="fargo"
                    id="fargo2"
                >
                    Fargo 598
                </div>

                <div
                    class="break"
                    id="break2"
                >
                    <span>BREAK</span>
                </div>

            </div>

        </div>

        <!-- LOWER INFORMATION STRIP -->
        <div class="bottomInfo">

            <div
                class="infoCell"
                id="game"
            >
                <span class="ballIcon">9</span>
                <span id="gameText">9-BALL</span>
            </div>

            <div
                class="infoCell"
                id="format"
            >
                SCOTCH DOUBLES
            </div>

            <div
                class="infoCell"
                id="race"
            >
                RACE TO 5
            </div>

        </div>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script src="config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const matchRef = database.ref("match");


function text(id, value) {
    document.getElementById(id).textContent = value;
}


function renderMatch(data) {

    if (!data) return;

    const p1 = data.player1 || {};
    const p2 = data.player2 || {};

    /* PLAYER NAMES */

    text(
        "player1",
        p1.name || "PLAYER ONE"
    );

    text(
        "player2",
        p2.name || "PLAYER TWO"
    );


    /* FARGO */

    text(
        "fargo1",
        p1.fargo
            ? "Fargo " + p1.fargo
            : ""
    );

    text(
        "fargo2",
        p2.fargo
            ? "Fargo " + p2.fargo
            : ""
    );


    /* SCORES */

    text(
        "score1",
        Number(p1.score) || 0
    );

    text(
        "score2",
        Number(p2.score) || 0
    );


    /* GAME */

    const game =
        data.game ||
        "9-Ball";

    text(
        "gameText",
        game.toUpperCase()
    );


    /* BALL ICON */

    let ballNumber = "9";

    if (game === "8-Ball") {
        ballNumber = "8";
    }

    if (game === "10-Ball") {
        ballNumber = "10";
    }

    if (game === "One Pocket") {
        ballNumber = "1";
    }

    if (game === "Banks") {
        ballNumber = "8";
    }

    document.querySelector(
        ".ballIcon"
    ).textContent = ballNumber;


    /* RACE */

    text(
        "race",
        "RACE TO " + (data.race || 5)
    );


    /* FORMAT
       Controller doesn't have this field yet,
       so default to Scotch Doubles.
    */

    text(
        "format",
        (
            data.format ||
            "SCOTCH DOUBLES"
        ).toUpperCase()
    );


    /* BREAK INDICATOR

       Supported values:
       data.break = 1
       data.break = 2
       data.break = "player1"
       data.break = "player2"
    */

    const break1 =
        document.getElementById("break1");

    const break2 =
        document.getElementById("break2");

    break1.style.display = "none";
    break2.style.display = "none";

    if (
        data.break === 1 ||
        data.break === "1" ||
        data.break === "player1"
    ) {
        break1.style.display = "flex";
    }

    if (
        data.break === 2 ||
        data.break === "2" ||
        data.break === "player2"
    ) {
        break2.style.display = "flex";
    }
}


matchRef.on(
    "value",
    snapshot => {

        if (snapshot.exists()) {
            renderMatch(
                snapshot.val()
            );
        }

    }
);
</script>

</body>
</html>
