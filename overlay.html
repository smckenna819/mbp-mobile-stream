<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBP Overlay</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

.stage{
  position:relative;
  width:100vw;
  height:100vh;
}

/* =========================
   MATCH INFORMATION
   ========================= */

.match-info{
  position:absolute;
  left:50%;
  bottom:13.2vh;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.55vw;

  font-size:.78vw;
  font-weight:800;
  letter-spacing:.10em;
  text-transform:uppercase;

  filter:drop-shadow(0 3px 5px rgba(0,0,0,.8));
}

.info-chip{
  background:linear-gradient(180deg,#20242b,#0b0d11);
  border:1px solid rgba(255,255,255,.35);
  border-radius:4px;
  padding:.38vw .75vw;
  white-space:nowrap;
}

.game-chip{
  border-color:rgba(255,255,255,.65);
  font-weight:900;
}


/* =========================
   SCOREBOARD
   ========================= */

.scoreboard{
  position:absolute;
  left:50%;
  bottom:2.4vh;
  transform:translateX(-50%);

  width:88vw;
  height:9.2vh;

  display:grid;

  grid-template-columns:
    7vw
    minmax(0,1fr)
    6vw
    8.5vw
    6vw
    minmax(0,1fr)
    7vw;

  filter:drop-shadow(0 5px 9px rgba(0,0,0,.8));
}


/* =========================
   SPONSOR BOXES
   ========================= */

.sponsor{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:.45vw;

  background:
    linear-gradient(180deg,#1d2026 0%,#090b0f 100%);

  border-top:1px solid rgba(255,255,255,.55);
  border-bottom:1px solid rgba(255,255,255,.30);
}

.sponsor.left{
  border-left:1px solid rgba(255,255,255,.45);
  border-radius:8px 0 0 8px;
}

.sponsor.right{
  border-right:1px solid rgba(255,255,255,.45);
  border-radius:0 8px 8px 0;
}

.sponsor img{
  width:100%;
  height:100%;
  object-fit:contain;
}


/* =========================
   PLAYER PANELS
   ========================= */

.player{
  position:relative;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:0 1.25vw;

  background:
    linear-gradient(
      180deg,
      rgba(34,38,46,.98) 0%,
      rgba(14,16,21,.98) 55%,
      rgba(5,6,9,.98) 100%
    );

  border-top:1px solid rgba(255,255,255,.55);
  border-bottom:1px solid rgba(255,255,255,.30);

  overflow:hidden;
}

.player1{
  border-left:3px solid #1677ff;
}

.player2{
  border-right:3px solid #ff2c2c;
  text-align:right;
}

.name{
  font-size:1.55vw;
  line-height:1;
  font-weight:900;
  letter-spacing:.035em;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.team{
  margin-top:.32vw;

  font-size:.72vw;
  line-height:1;
  font-weight:700;

  color:#bfc4cc;

  letter-spacing:.08em;
  text-transform:uppercase;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.team:empty{
  display:none;
}


/* =========================
   BREAK INDICATOR
   ========================= */

.break{
  position:absolute;
  bottom:0;

  padding:.17vw .55vw;

  font-size:.57vw;
  font-weight:900;

  letter-spacing:.15em;
  text-transform:uppercase;

  background:#fff;
  color:#050505;

  display:none;
}

.player1 .break{
  left:1.25vw;
}

.player2 .break{
  right:1.25vw;
}

.break.active{
  display:block;
}


/* =========================
   SCORE
   ========================= */

.score{
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:3.2vw;
  line-height:1;
  font-weight:900;

  background:
    linear-gradient(
      180deg,
      #242831 0%,
      #0b0d12 55%,
      #030405 100%
    );

  border-top:1px solid rgba(255,255,255,.55);
  border-bottom:1px solid rgba(255,255,255,.30);
  border-left:1px solid rgba(255,255,255,.16);
  border-right:1px solid rgba(255,255,255,.16);

  text-shadow:0 2px 4px #000;
}


/* =========================
   MBP CENTER
   ========================= */

.brand{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:.35vw;

  background:
    radial-gradient(
      circle at center,
      #242831 0%,
      #0b0d11 60%,
      #030405 100%
    );

  border-top:1px solid rgba(255,255,255,.65);
  border-bottom:1px solid rgba(255,255,255,.35);
}

.brand img{
  width:100%;
  height:100%;
  object-fit:contain;
}


/* =========================
   ONE POCKET BALL COUNT
   ========================= */

.one-pocket{
  position:absolute;

  left:50%;
  bottom:12.8vh;

  transform:translateX(-50%);

  display:none;

  grid-template-columns:1fr 1fr;

  width:25vw;

  background:rgba(8,10,14,.97);

  border:1px solid rgba(255,255,255,.5);
  border-radius:5px;

  overflow:hidden;

  filter:drop-shadow(0 3px 5px rgba(0,0,0,.8));
}

.ball-count{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:.5vw;

  padding:.35vw;

  font-size:.72vw;
  font-weight:800;

  letter-spacing:.08em;
}

.ball-count:first-child{
  border-right:1px solid rgba(255,255,255,.25);
}

.ball-number{
  font-size:1.15vw;
  font-weight:900;
}


/* =========================
   HIDDEN
   ========================= */

.hidden{
  display:none !important;
}
</style>
</head>


<body>

<div class="stage" id="stage">


  <!-- MATCH INFORMATION -->

  <div class="match-info" id="matchInfo">

    <div class="info-chip game-chip" id="gameType">
      9-BALL
    </div>

    <div class="info-chip" id="raceInfo">
      RACE TO 5
    </div>

    <div class="info-chip" id="breakFormat">
      ALTERNATE BREAK
    </div>

  </div>


  <!-- ONE POCKET BALL COUNTER -->

  <div class="one-pocket" id="onePocket">

    <div class="ball-count">
      P1 BALLS
      <span class="ball-number" id="balls1">0</span>
    </div>

    <div class="ball-count">
      P2 BALLS
      <span class="ball-number" id="balls2">0</span>
    </div>

  </div>


  <!-- SCOREBOARD -->

  <div class="scoreboard">


    <!-- LEFT SPONSOR -->

    <div class="sponsor left">

      <img
        id="sponsorLeft"
        alt=""
      >

    </div>


    <!-- PLAYER 1 -->

    <div class="player player1">

      <div class="name" id="player1">
        PLAYER ONE
      </div>

      <div class="team" id="team1"></div>

      <div class="break" id="break1">
        BREAK
      </div>

    </div>


    <!-- SCORE 1 -->

    <div class="score" id="score1">
      0
    </div>


    <!-- MBP -->

    <div class="brand">

      <img
        src="mbp-logo.png"
        alt="McKenna Billiard Productions"
      >

    </div>


    <!-- SCORE 2 -->

    <div class="score" id="score2">
      0
    </div>


    <!-- PLAYER 2 -->

    <div class="player player2">

      <div class="name" id="player2">
        PLAYER TWO
      </div>

      <div class="team" id="team2"></div>

      <div class="break" id="break2">
        BREAK
      </div>

    </div>


    <!-- RIGHT SPONSOR -->

    <div class="sponsor right">

      <img
        id="sponsorRight"
        alt=""
      >

    </div>

  </div>

</div>


<script src="config.js"></script>
<script src="shared.js"></script>

<script>

function text(id,value){
  const el=document.getElementById(id);
  if(el) el.textContent=value ?? "";
}


function render(s){

  if(!s) return;


  /* PLAYERS */

  text("player1",s.p1 || "PLAYER ONE");
  text("player2",s.p2 || "PLAYER TWO");


  /* TEAM NAMES
     Blank means completely hidden.
  */

  text("team1",s.team1 || "");
  text("team2",s.team2 || "");


  /* SCORE */

  text("score1",s.score1 ?? 0);
  text("score2",s.score2 ?? 0);


  /* GAME */

  const game=s.game || "9-Ball";

  text(
    "gameType",
    String(game).toUpperCase()
  );


  /* RACE */

  const race1=s.race1 ?? 5;
  const race2=s.race2 ?? race1;

  if(race1===race2){

    text(
      "raceInfo",
      "RACE TO " + race1
    );

  }else{

    text(
      "raceInfo",
      "RACE " + race1 + " / " + race2
    );

  }


  /* BREAK FORMAT */

  let format=s.breakFormat || "Alternate Break";

  if(
    String(game).toLowerCase()
      .includes("one pocket")
  ){
    format="Alternate Break";
  }

  text(
    "breakFormat",
    String(format).toUpperCase()
  );


  /* BREAK INDICATOR */

  const b1=document.getElementById("break1");
  const b2=document.getElementById("break2");

  b1.classList.remove("active");
  b2.classList.remove("active");

  if(Number(s.breakPlayer)===1){
    b1.classList.add("active");
  }

  if(Number(s.breakPlayer)===2){
    b2.classList.add("active");
  }


  /* ONE POCKET */

  const isOnePocket=
    String(game)
      .toLowerCase()
      .includes("one pocket");

  const op=
    document.getElementById("onePocket");

  const info=
    document.getElementById("matchInfo");

  if(isOnePocket){

    op.style.display="grid";

    text(
      "balls1",
      s.balls1 ?? 0
    );

    text(
      "balls2",
      s.balls2 ?? 0
    );

    info.style.bottom="18.2vh";

  }else{

    op.style.display="none";
    info.style.bottom="13.2vh";

  }


  /* OVERLAY VISIBILITY */

  document.getElementById("stage").style.display=
    s.visible===false
      ? "none"
      : "block";

}


if(typeof initSync==="function"){

  initSync(render);

}else{

  /* Allows us to visually inspect the overlay
     even if sync isn't available.
  */

  render({
    p1:"PLAYER ONE",
    p2:"PLAYER TWO",

    team1:"",
    team2:"",

    score1:0,
    score2:0,

    game:"9-Ball",

    race1:5,
    race2:5,

    breakFormat:"Alternate Break",

    breakPlayer:1,

    visible:true
  });

}

</script>

</body>
</html>
