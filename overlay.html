<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MBP Overlay</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

#scoreboard {
    position: absolute;
    left: 0;
    top: 737px;
    width: 1920px;
    height: 325px;
}

/* =========================
   SCOREBOARD SHELL
   ========================= */

#shell {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 325px;
    z-index: 1;
    pointer-events: none;
}

/* =========================
   PLAYER 1
   ========================= */

#p1Name {
    position: absolute;
    left: 405px;
    top: 145px;
    width: 280px;

    color: #ffffff;
    font-size: 28px;
    font-weight: 800;
    line-height: 36px;

    white-space: nowrap;
    overflow: visible;

    text-shadow:
        0 2px 2px rgba(0,0,0,.95),
        0 0 4px rgba(0,0,0,.8);

    z-index: 10;
}

#p1Fargo {
    position: absolute;
    left: 422px;
    top: 201px;
    width: 220px;

    color: #ffffff;
    font-size: 19px;
    font-weight: 400;
    line-height: 26px;

    white-space: nowrap;

    text-shadow:
        0 2px 2px rgba(0,0,0,.95);

    z-index: 10;
}

#p1Score {
    position: absolute;
    left: 714px;
    top: 134px;
    width: 110px;
    height: 90px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #ffffff;
    font-size: 58px;
    font-weight: 900;
    line-height: 1;

    text-align: center;

    text-shadow:
        0 3px 3px rgba(0,0,0,.95);

    z-index: 10;
}

/* =========================
   PLAYER 2
   ========================= */

#p2Name {
    position: absolute;
    left: 1285px;
    top: 145px;
    width: 280px;

    color: #ffffff;
    font-size: 28px;
    font-weight: 800;
    line-height: 36px;

    white-space: nowrap;
    overflow: visible;

    text-shadow:
        0 2px 2px rgba(0,0,0,.95),
        0 0 4px rgba(0,0,0,.8);

    z-index: 10;
}

#p2Fargo {
    position: absolute;
    left: 1365px;
    top: 201px;
    width: 220px;

    color: #ffffff;
    font-size: 19px;
    font-weight: 400;
    line-height: 26px;

    white-space: nowrap;

    text-shadow:
        0 2px 2px rgba(0,0,0,.95);

    z-index: 10;
}

#p2Score {
    position: absolute;
    left: 1087px;
    top: 134px;
    width: 110px;
    height: 90px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #ffffff;
    font-size: 58px;
    font-weight: 900;
    line-height: 1;

    text-align: center;

    text-shadow:
        0 3px 3px rgba(0,0,0,.95);

    z-index: 10;
}

/* =========================
   MBP CENTER LOGO
   ========================= */

#mbpLogo {
    position: absolute;

    /* centered on the 1920px scoreboard */
    left: 960px;
    top: 130px;

    width: 125px;
    height: auto;

    transform: translateX(-50%);

    object-fit: contain;

    z-index: 9;
    pointer-events: none;
}

/* =========================
   LOWER INFORMATION BAR
   LOCKED AT 261px
   ========================= */

.lowerItem {
    position: absolute;
    top: 261px;

    color: #ffffff;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 21px;
    font-weight: 800;
    line-height: 26px;

    text-align: center;
    white-space: nowrap;

    text-shadow:
        0 2px 2px rgba(0,0,0,.95);

    z-index: 10;
}

#race1 {
    left: 570px;
    width: 220px;
}

#gameType {
    left: 850px;
    width: 220px;
}

#race2 {
    left: 1130px;
    width: 220px;
}
</style>
</head>

<body>

<div id="scoreboard">

    <img
        id="shell"
        src="scoreboard-shell.png"
        alt=""
    >

    <!-- PLAYER 1 -->
    <div id="p1Name">PLAYER ONE</div>
    <div id="p1Fargo">FargoRate</div>
    <div id="p1Score">0</div>

    <!-- CENTER MBP LOGO -->
    <img
        id="mbpLogo"
        src="mbp-logo.png"
        alt="McKenna Billiard Productions"
    >

    <!-- PLAYER 2 -->
    <div id="p2Score">0</div>
    <div id="p2Name">PLAYER TWO</div>
    <div id="p2Fargo">FargoRate</div>

    <!-- LOWER BAR -->
    <div id="race1" class="lowerItem">RACE TO 5</div>
    <div id="gameType" class="lowerItem">9-BALL</div>
    <div id="race2" class="lowerItem">RACE TO 5</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const matchRef = database.ref("match");

const p1Name = document.getElementById("p1Name");
const p1Fargo = document.getElementById("p1Fargo");
const p1Score = document.getElementById("p1Score");

const p2Name = document.getElementById("p2Name");
const p2Fargo = document.getElementById("p2Fargo");
const p2Score = document.getElementById("p2Score");

const race1 = document.getElementById("race1");
const gameType = document.getElementById("gameType");
const race2 = document.getElementById("race2");

function formatGame(game) {

    if (!game) {
        return "9-BALL";
    }

    const value = String(game).trim().toLowerCase();

    if (value === "9-ball" || value === "9 ball") {
        return "9-BALL";
    }

    if (value === "8-ball" || value === "8 ball") {
        return "8-BALL";
    }

    if (value === "10-ball" || value === "10 ball") {
        return "10-BALL";
    }

    if (value === "one pocket" || value === "one-pocket") {
        return "ONE POCKET";
    }

    if (value === "banks" || value === "bank") {
        return "BANKS";
    }

    return String(game).toUpperCase();
}

matchRef.on("value", snapshot => {

    const data = snapshot.val() || {};

    /* PLAYER 1 */

    p1Name.textContent =
        data.player1?.name || "PLAYER ONE";

    p1Fargo.textContent =
        data.player1?.fargo
            ? "FargoRate " + data.player1.fargo
            : "FargoRate";

    p1Score.textContent =
        data.player1?.score ?? 0;


    /* PLAYER 2 */

    p2Name.textContent =
        data.player2?.name || "PLAYER TWO";

    p2Fargo.textContent =
        data.player2?.fargo
            ? "FargoRate " + data.player2.fargo
            : "FargoRate";

    p2Score.textContent =
        data.player2?.score ?? 0;


    /* GAME TYPE */

    gameType.textContent =
        formatGame(data.game);


    /*
       CURRENT CONTROLLER:
       One race value controls both sides.

       Later we'll change the controller/Firebase
       structure to race1 and race2 for handicapped
       matches.
    */

    const currentRace =
        Number(data.race) || 5;

    race1.textContent =
        "RACE TO " + currentRace;

    race2.textContent =
        "RACE TO " + currentRace;
});
</script>

</body>
</html>
