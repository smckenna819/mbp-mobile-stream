<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBP Overlay</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

.stage{
  position:relative;
  width:100vw;
  height:100vh;
}

/* =========================================================
   SCOREBOARD
   ========================================================= */

.scoreboard{
  position:absolute;
  left:50%;
  bottom:7%;
  transform:translateX(-50%);
  width:97%;
  max-width:1860px;
  height:190px;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.85));
}

.main{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:145px;
  display:grid;
  grid-template-columns:14% 23% 8% 10% 8% 23% 14%;
  align-items:stretch;
}

/* =========================================================
   SPONSOR ENDCAPS
   ========================================================= */

.sponsor{
  position:relative;
  z-index:4;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#1b1d21 0%,#050607 100%);
  border:3px solid #8c8f94;
  box-shadow:
    inset 0 0 18px rgba(255,255,255,.08),
    0 0 7px rgba(0,0,0,.9);
  overflow:hidden;
}

.sponsor.left{
  border-radius:18px 0 0 18px;
  clip-path:polygon(0 0,88% 0,100% 100%,0 100%);
  padding-right:12%;
}

.sponsor.right{
  border-radius:0 18px 18px 0;
  clip-path:polygon(12% 0,100% 0,100% 100%,0 100%);
  padding-left:12%;
}

.sponsor img{
  width:88%;
  height:82%;
  object-fit:contain;
}

/* Hide broken placeholder icons until sponsor files exist */
.sponsor img[src=""]{
  display:none;
}

/* =========================================================
   PLAYER PANELS
   ========================================================= */

.player{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:linear-gradient(180deg,#15171b,#050608);
  overflow:hidden;
}

.player.left{
  padding:20px 28px 20px 42px;
  border-top:2px solid #34373d;
  border-bottom:2px solid #34373d;
}

.player.right{
  padding:20px 42px 20px 28px;
  text-align:right;
  border-top:2px solid #34373d;
  border-bottom:2px solid #34373d;
}

/* blue wedge */

.player.left:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:28px;
  height:100%;
  background:linear-gradient(180deg,#1596ff,#004bd2);
  clip-path:polygon(0 0,100% 0,42% 100%,0 100%);
}

/* red wedge */

.player.right:after{
  content:"";
  position:absolute;
  right:0;
  top:0;
  width:28px;
  height:100%;
  background:linear-gradient(180deg,#ff2630,#c4000a);
  clip-path:polygon(58% 0,100% 0,100% 100%,0 100%);
}

.name{
  font-size:34px;
  line-height:1.05;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 3px 4px #000;
}

.player-sub{
  display:flex;
  align-items:center;
  gap:15px;
  margin-top:12px;
  font-size:20px;
  color:#e5e5e5;
}

.player.right .player-sub{
  justify-content:flex-end;
}

/* =========================================================
   BREAK BADGE
   ========================================================= */

.break{
  display:none;
  position:relative;
  padding:5px 16px;
  background:#ec111b;
  color:#fff;
  font-size:18px;
  font-weight:900;
  font-style:italic;
  transform:skew(-14deg);
  border-left:5px solid #ff3941;
  border-right:5px solid #ff3941;
  box-shadow:0 2px 5px #000;
}

.break.blue{
  background:#0769db;
  border-color:#1c92ff;
}

.break span{
  display:block;
  transform:skew(14deg);
}

/* =========================================================
   SCORE AREAS
   ========================================================= */

.score-area{
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#07080a;
}

.score-pod{
  width:92%;
  height:112px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:66px;
  line-height:1;
  font-weight:900;
  background:linear-gradient(180deg,#1b1d22,#060709);
  text-shadow:0 3px 5px #000;
}

.score-pod.blue{
  border:5px solid #086fe8;
  clip-path:polygon(13% 0,100% 0,87% 100%,0 100%);
  box-shadow:inset 0 0 15px rgba(0,120,255,.35);
}

.score-pod.red{
  border:5px solid #e20e18;
  clip-path:polygon(0 0,87% 0,100% 100%,13% 100%);
  box-shadow:inset 0 0 15px rgba(255,0,0,.35);
}

/* =========================================================
   CENTER MBP
   ========================================================= */

.brand{
  position:relative;
  z-index:6;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#0e0f12,#020304);
  overflow:visible;
}

.brand:before{
  content:"";
  position:absolute;
  inset:0;
  border-top:2px solid #2f3136;
  border-bottom:2px solid #2f3136;
  pointer-events:none;
}

.brand img{
  position:relative;
  z-index:2;
  width:94%;
  max-height:128px;
  object-fit:contain;
  filter:drop-shadow(0 3px 4px #000);
}

/* =========================================================
   LOWER MATCH BAR
   ========================================================= */

.lower{
  position:absolute;
  left:27%;
  top:137px;
  width:46%;
  height:45px;
  z-index:10;
  display:grid;
  grid-template-columns:1fr 1.45fr 1fr;
  background:linear-gradient(180deg,#17191d,#050607);
  border-top:2px solid #777;
  border-bottom:2px solid #555;
  clip-path:polygon(3% 0,97% 0,94% 100%,6% 100%);
}

.lower-cell{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:700;
  text-shadow:0 2px 3px #000;
}

.lower-cell:not(:last-child):after{
  content:"";
  position:absolute;
  right:0;
  width:2px;
  height:55%;
  background:#aaa;
}

.game{
  font-weight:900;
}

.ball-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:29px;
  height:29px;
  margin-right:9px;
  border-radius:50%;
  background:#f1c62b;
  color:#111;
  border:2px solid #fff;
  font-size:14px;
  font-weight:900;
}

/* blue/red decorative lower slashes */

.lower:before{
  content:"";
  position:absolute;
  left:3.5%;
  bottom:0;
  width:9px;
  height:100%;
  background:#087cff;
  transform:skew(-16deg);
}

.lower:after{
  content:"";
  position:absolute;
  right:3.5%;
  bottom:0;
  width:9px;
  height:100%;
  background:#ef1721;
  transform:skew(-16deg);
}

/* =========================================================
   ONE POCKET COUNTER
   ========================================================= */

.one-pocket{
  display:none;
  position:absolute;
  left:50%;
  bottom:200px;
  transform:translateX(-50%);
  min-width:390px;
  height:46px;
  grid-template-columns:1fr 1fr;
  background:linear-gradient(180deg,#1a1c20,#050607);
  border:2px solid #888;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 5px 10px rgba(0,0,0,.7);
}

.ball-count{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 20px;
  font-size:17px;
  font-weight:900;
}

.ball-count:first-child{
  border-right:1px solid #777;
}

.ball-number{
  margin-left:12px;
  font-size:27px;
}

/* =========================================================
   SMALLER SCREENS
   ========================================================= */

@media(max-width:1200px){
  .scoreboard{
    width:98%;
    height:150px;
  }

  .main{
    height:112px;
  }

  .name{font-size:25px}
  .player-sub{font-size:15px}
  .score-pod{height:88px;font-size:50px}
  .brand img{max-height:96px}

  .lower{
    top:106px;
    height:38px;
  }

  .lower-cell{
    font-size:15px;
  }
}

</style>
</head>

<body>

<div class="stage" id="stage">

  <div class="one-pocket" id="onePocket">
    <div class="ball-count">
      P1 BALLS <span class="ball-number" id="balls1">0</span>
    </div>

    <div class="ball-count">
      P2 BALLS <span class="ball-number" id="balls2">0</span>
    </div>
  </div>


  <div class="scoreboard">

    <div class="main">

      <!-- LEFT ROTATING SPONSOR -->
      <div class="sponsor left">
        <img id="sponsorLeft" src="" alt="">
      </div>


      <!-- PLAYER 1 -->
      <div class="player left">

        <div class="name" id="player1">
          PLAYER ONE
        </div>

        <div class="player-sub">

          <div class="break blue" id="break1">
            <span>BREAK</span>
          </div>

          <div id="fargo1">
            Fargo 620
          </div>

        </div>

      </div>


      <!-- SCORE 1 -->
      <div class="score-area">
        <div class="score-pod blue" id="score1">
          0
        </div>
      </div>


      <!-- CENTER LOGO -->
      <div class="brand">
        <img
          src="mbp-logo.png"
          alt="McKenna Billiard Productions"
        >
      </div>


      <!-- SCORE 2 -->
      <div class="score-area">
        <div class="score-pod red" id="score2">
          0
        </div>
      </div>


      <!-- PLAYER 2 -->
      <div class="player right">

        <div class="name" id="player2">
          PLAYER TWO
        </div>

        <div class="player-sub">

          <div id="fargo2">
            Fargo 598
          </div>

          <div class="break" id="break2">
            <span>BREAK</span>
          </div>

        </div>

      </div>


      <!-- RIGHT ROTATING SPONSOR -->
      <div class="sponsor right">
        <img id="sponsorRight" src="" alt="">
      </div>

    </div>


    <!-- LOWER MATCH BAR -->
    <div class="lower">

      <div class="lower-cell game">
        <span class="ball-icon" id="ballIcon">9</span>
        <span id="gameType">9-BALL</span>
      </div>

      <div class="lower-cell" id="matchType">
        SCOTCH DOUBLES
      </div>

      <div class="lower-cell" id="race">
        RACE TO 5
      </div>

    </div>

  </div>

</div>


<script src="config.js"></script>
<script src="shared.js"></script>

<script>

function render(s){

  document.getElementById("player1").textContent =
    s.p1 || "PLAYER ONE";

  document.getElementById("player2").textContent =
    s.p2 || "PLAYER TWO";


  document.getElementById("score1").textContent =
    s.score1 ?? 0;

  document.getElementById("score2").textContent =
    s.score2 ?? 0;


  document.getElementById("fargo1").textContent =
    s.fargo1 ? "Fargo " + s.fargo1 : "";

  document.getElementById("fargo2").textContent =
    s.fargo2 ? "Fargo " + s.fargo2 : "";


  const game = s.game || "9-Ball";

  document.getElementById("gameType").textContent =
    game.toUpperCase();


  const ballIcon =
    document.getElementById("ballIcon");

  if(game === "8-Ball"){
    ballIcon.textContent = "8";
  }
  else if(game === "9-Ball"){
    ballIcon.textContent = "9";
  }
  else if(game === "10-Ball"){
    ballIcon.textContent = "10";
  }
  else{
    ballIcon.textContent = "●";
  }


  document.getElementById("matchType").textContent =
    s.matchType || "SCOTCH DOUBLES";


  const race1 = s.race1 || 5;
  const race2 = s.race2 || race1;

  document.getElementById("race").textContent =
    race1 === race2
      ? "RACE TO " + race1
      : "RACE " + race1 + " / " + race2;


  document.getElementById("break1").style.display =
    s.breakPlayer === 1 ? "block" : "none";

  document.getElementById("break2").style.display =
    s.breakPlayer === 2 ? "block" : "none";


  const onePocket =
    game.toLowerCase() === "one pocket";

  document.getElementById("onePocket").style.display =
    onePocket ? "grid" : "none";


  document.getElementById("balls1").textContent =
    s.balls1 ?? 0;

  document.getElementById("balls2").textContent =
    s.balls2 ?? 0;


  document.getElementById("stage").style.display =
    s.visible === false ? "none" : "block";
}


initSync(render);

</script>

</body>
</html>
