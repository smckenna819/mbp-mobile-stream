<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBP Overlay</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

.stage{
    position:relative;
    width:100vw;
    height:100vh;
}

/* =========================================================
   ENTIRE SCOREBOARD
   Designed against a 1920 x 1080 canvas
   ========================================================= */

.scoreboard{
    position:absolute;
    left:50%;
    bottom:3.2%;
    transform:translateX(-50%);

    width:97%;
    height:150px;

    display:flex;
    align-items:stretch;

    filter:drop-shadow(0 8px 9px rgba(0,0,0,.75));
}


/* =========================================================
   SPONSOR BOXES
   ========================================================= */

.sponsor{
    position:relative;
    width:15%;
    min-width:0;

    background:
        linear-gradient(180deg,#15171b 0%,#050608 100%);

    border:3px solid #72767b;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;
}

.sponsor.leftSponsor{
    border-radius:12px 0 0 12px;
    clip-path:polygon(0 0,86% 0,100% 100%,0 100%);
    padding-right:10%;
}

.sponsor.rightSponsor{
    border-radius:0 12px 12px 0;
    clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);
    padding-left:10%;
}

.sponsor img{
    width:90%;
    height:82%;
    object-fit:contain;
}


/* =========================================================
   PLAYER PANELS
   ========================================================= */

.player{
    position:relative;
    width:22%;
    min-width:0;

    background:
        linear-gradient(180deg,#15171b 0%,#08090b 100%);

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.player1{
    padding:18px 28px 18px 38px;
    border-left:9px solid #078cff;
}

.player2{
    padding:18px 38px 18px 28px;
    border-right:9px solid #ff1723;
    text-align:right;
}

.playerName{
    font-size:32px;
    line-height:1;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:0 2px 3px #000;
}

.playerInfo{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:11px;
    min-height:31px;
}

.player2 .playerInfo{
    justify-content:flex-end;
}

.fargo{
    font-size:22px;
    color:#e7e7e7;
    white-space:nowrap;
}

.breakBadge{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    height:31px;
    padding:0 18px;

    background:#f21d28;
    transform:skew(-13deg);

    font-size:20px;
    font-weight:900;
    line-height:31px;

    box-shadow:
        inset 4px 0 0 rgba(255,255,255,.14),
        inset -4px 0 0 rgba(0,0,0,.25);
}

.breakBadge span{
    transform:skew(13deg);
}


/* =========================================================
   SCORE BOXES
   ========================================================= */

.scoreSection{
    width:8%;
    min-width:105px;

    background:#08090b;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

.scoreFrame{
    width:90px;
    height:105px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:linear-gradient(180deg,#16191e,#08090c);

    transform:skew(-7deg);
}

.scoreSection.blue .scoreFrame{
    border-top:5px solid #078cff;
    border-bottom:5px solid #078cff;

    box-shadow:
        inset 5px 0 12px rgba(0,140,255,.18),
        0 0 5px rgba(0,140,255,.35);
}

.scoreSection.red .scoreFrame{
    border-top:5px solid #ff1723;
    border-bottom:5px solid #ff1723;

    box-shadow:
        inset -5px 0 12px rgba(255,23,35,.18),
        0 0 5px rgba(255,23,35,.35);
}

.score{
    transform:skew(7deg);

    font-size:68px;
    line-height:1;
    font-weight:900;

    text-shadow:0 3px 4px #000;
}


/* =========================================================
   CENTER MBP LOGO
   ========================================================= */

.brand{
    width:12%;
    min-width:150px;

    background:#050607;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:10px 14px;

    position:relative;
}

.brand img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
}


/* =========================================================
   LOWER MATCH INFO BAR
   ========================================================= */

.infoBar{
    position:absolute;

    left:50%;
    bottom:-42px;
    transform:translateX(-50%);

    width:47%;
    height:43px;

    background:linear-gradient(180deg,#15171a,#070809);

    display:grid;
    grid-template-columns:1fr 1.35fr 1fr;
    align-items:center;

    clip-path:polygon(
        2% 0,
        98% 0,
        96% 100%,
        4% 100%
    );

    border-top:2px solid #777;

    z-index:20;
}

.infoItem{
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
    font-weight:900;
    white-space:nowrap;
}

.infoItem + .infoItem{
    border-left:2px solid #777;
}

.gameBall{
    width:26px;
    height:26px;
    border-radius:50%;

    background:#ffd52a;
    color:#111;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    margin-right:10px;

    font-size:13px;
    font-weight:900;

    border:2px solid white;
}


/* =========================================================
   VENUE / EVENT
   ========================================================= */

.venue{
    position:absolute;
    left:50%;
    bottom:205px;
    transform:translateX(-50%);

    padding:8px 25px;

    border-radius:6px;

    background:rgba(5,6,8,.88);
    border:1px solid rgba(255,255,255,.28);

    font-size:18px;
    font-weight:700;
    letter-spacing:.04em;

    display:none;
}


/* =========================================================
   RESPONSIVE SCALING
   ========================================================= */

@media(max-width:1400px){

    .scoreboard{
        height:125px;
    }

    .playerName{
        font-size:25px;
    }

    .fargo{
        font-size:17px;
    }

    .breakBadge{
        height:26px;
        line-height:26px;
        font-size:16px;
    }

    .scoreFrame{
        width:72px;
        height:88px;
    }

    .score{
        font-size:55px;
    }

    .infoBar{
        bottom:-36px;
        height:37px;
    }

    .infoItem{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="stage">

    <div id="venueDisplay" class="venue"></div>

    <div class="scoreboard">

        <!-- LEFT ROTATING SPONSOR -->
        <div class="sponsor leftSponsor">
            <img id="leftSponsor" src="" alt="">
        </div>


        <!-- PLAYER 1 -->
        <div class="player player1">

            <div id="player1Name" class="playerName">
                PLAYER ONE
            </div>

            <div class="playerInfo">

                <div id="break1" class="breakBadge">
                    <span>BREAK</span>
                </div>

                <div id="fargo1" class="fargo">
                    Fargo 620
                </div>

            </div>

        </div>


        <!-- PLAYER 1 SCORE -->
        <div class="scoreSection blue">

            <div class="scoreFrame">
                <div id="score1" class="score">0</div>
            </div>

        </div>


        <!-- MBP CENTER LOGO -->
        <div class="brand">
            <img src="mbp-logo.png" alt="McKenna Billiard Productions">
        </div>


        <!-- PLAYER 2 SCORE -->
        <div class="scoreSection red">

            <div class="scoreFrame">
                <div id="score2" class="score">0</div>
            </div>

        </div>


        <!-- PLAYER 2 -->
        <div class="player player2">

            <div id="player2Name" class="playerName">
                PLAYER TWO
            </div>

            <div class="playerInfo">

                <div id="fargo2" class="fargo">
                    Fargo 598
                </div>

                <div id="break2" class="breakBadge" style="display:none;">
                    <span>BREAK</span>
                </div>

            </div>

        </div>


        <!-- RIGHT ROTATING SPONSOR -->
        <div class="sponsor rightSponsor">
            <img id="rightSponsor" src="" alt="">
        </div>


        <!-- LOWER INFORMATION BAR -->
        <div class="infoBar">

            <div class="infoItem">
                <span id="gameBall" class="gameBall">9</span>
                <span id="gameDisplay">9-BALL</span>
            </div>

            <div id="formatDisplay" class="infoItem">
                SCOTCH DOUBLES
            </div>

            <div id="raceDisplay" class="infoItem">
                RACE TO 5
            </div>

        </div>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script src="config.js"></script>

<script>

firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const matchRef = database.ref("match");


function safeText(value, fallback){
    if(value === undefined || value === null || value === ""){
        return fallback;
    }

    return value;
}


function gameNumber(game){

    const value = String(game).toLowerCase();

    if(value.includes("8")){
        return "8";
    }

    if(value.includes("10")){
        return "10";
    }

    if(value.includes("9")){
        return "9";
    }

    if(value.includes("one")){
        return "1";
    }

    if(value.includes("bank")){
        return "B";
    }

    return "9";
}


function render(match){

    const p1 = match.player1 || {};
    const p2 = match.player2 || {};

    document.getElementById("player1Name").textContent =
        safeText(p1.name, "PLAYER ONE");

    document.getElementById("player2Name").textContent =
        safeText(p2.name, "PLAYER TWO");


    document.getElementById("score1").textContent =
        Number(p1.score) || 0;

    document.getElementById("score2").textContent =
        Number(p2.score) || 0;


    document.getElementById("fargo1").textContent =
        p1.fargo ? "Fargo " + p1.fargo : "";

    document.getElementById("fargo2").textContent =
        p2.fargo ? "Fargo " + p2.fargo : "";


    const game = safeText(match.game, "9-Ball");

    document.getElementById("gameDisplay").textContent =
        String(game).toUpperCase();

    document.getElementById("gameBall").textContent =
        gameNumber(game);


    document.getElementById("raceDisplay").textContent =
        "RACE TO " + (Number(match.race) || 5);


    const venue = document.getElementById("venueDisplay");

    if(match.venue){

        venue.textContent = match.venue;
        venue.style.display = "block";

    } else {

        venue.style.display = "none";

    }


    /*
       These fields do not exist in the controller yet,
       but the overlay is ready for them.
    */

    const format = match.format || "Scotch Doubles";

    document.getElementById("formatDisplay").textContent =
        String(format).toUpperCase();


    const breaker = Number(match.breaker) || 1;

    document.getElementById("break1").style.display =
        breaker === 1 ? "inline-flex" : "none";

    document.getElementById("break2").style.display =
        breaker === 2 ? "inline-flex" : "none";

}


matchRef.on("value", snapshot => {

    if(snapshot.exists()){
        render(snapshot.val());
    }

});

</script>

</body>
</html>
