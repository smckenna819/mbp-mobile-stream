<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBP Overlay</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

#viewport{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#frame{
    position:absolute;
    width:1920px;
    height:1080px;
    left:50%;
    top:50%;
    transform-origin:center center;
}


/* =========================================================
   SCOREBOARD — LOCKED
   ========================================================= */

#scoreboard{
    position:absolute;
    left:0;
    top:737px;
    width:1920px;
    height:325px;
}


/* =========================================================
   SHELL — LOCKED
   ========================================================= */

#shell{
    position:absolute;
    width:1920px;
    height:1080px;
    left:0;
    top:-405px;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
    z-index:1;
}


/* =========================================================
   SPONSORS
   ========================================================= */

#leftSponsor{
    position:absolute;
    left:95px;
    top:66px;
    width:235px;
    height:132px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5;
}

#leftSponsor img{
    max-width:90%;
    max-height:88%;
    object-fit:contain;
}

#rightSponsor{
    position:absolute;
    right:95px;
    top:66px;
    width:235px;
    height:132px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5;
}

#rightSponsor img{
    max-width:90%;
    max-height:88%;
    object-fit:contain;
}


/* =========================================================
   PLAYER ONE — LOCKED
   ========================================================= */

#player1{
    position:absolute;
    left:330px;
    top:95px;
    width:360px;
    height:145px;
    z-index:6;
}

#player1Singles{
    position:absolute;
    inset:0;
}

#player1Name{
    position:absolute;

    left:24px;
    top:48px;

    width:330px;
    height:32px;

    display:flex;
    align-items:center;

    font-size:27px;
    line-height:30px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-align:left;

    text-shadow:
        0 2px 2px #000,
        0 3px 5px rgba(0,0,0,.9);
}

#player1SingleInfo{
    position:absolute;

    left:44px;
    top:105px;

    width:298px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:flex-start;

    gap:13px;
}

#fargo1{
    flex:0 0 auto;

    font-size:20px;
    line-height:24px;

    color:#e2e2e2;

    white-space:nowrap;

    text-shadow:0 2px 3px #000;
}


/* =========================================================
   PLAYER ONE — SCOTCH DOUBLES
   ========================================================= */

#player1Doubles{
    position:absolute;
    inset:0;
    display:none;
}

#team1Name{
    position:absolute;

    left:4px;
    top:0;

    width:335px;
    height:18px;

    font-size:15px;
    line-height:18px;

    font-weight:900;
    letter-spacing:.4px;

    color:#bfc7d2;

    white-space:nowrap;
    overflow:hidden;

    text-shadow:0 2px 3px #000;
}

#team1Name:empty{
    display:none;
}

#team1Row1{
    position:absolute;

    left:18px;
    top:31px;

    width:320px;
    height:23px;

    display:flex;
    align-items:center;

    gap:8px;
}

#team1Row2{
    position:absolute;

    left:34px;
    top:59px;

    width:302px;
    height:23px;

    display:flex;
    align-items:center;

    gap:8px;
}

.teamPlayerName{
    flex:1 1 auto;
    min-width:0;

    font-size:19px;
    line-height:21px;

    font-weight:900;

    white-space:nowrap;
    overflow:hidden;

    text-shadow:
        0 2px 2px #000,
        0 3px 4px rgba(0,0,0,.8);
}

.teamPlayerFargo{
    flex:0 0 auto;

    font-size:16px;
    line-height:19px;

    font-weight:700;

    color:#e2e2e2;

    white-space:nowrap;

    text-shadow:0 2px 3px #000;
}

#team1Bottom{
    position:absolute;

    left:52px;
    top:91px;

    width:285px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:flex-start;

    gap:12px;
}

#team1Fargo{
    flex:0 0 auto;

    font-size:17px;
    line-height:20px;

    font-weight:900;

    white-space:nowrap;

    color:#fff;

    text-shadow:0 2px 3px #000;
}


/* =========================================================
   BREAK INDICATORS
   ========================================================= */

.breakIndicator{
    display:none;

    flex:0 0 auto;

    background:#ef1723;

    padding:4px 14px 5px;

    font-size:18px;
    line-height:20px;

    font-weight:900;
    font-style:italic;

    color:#fff;

    transform:skew(-10deg);

    box-shadow:0 2px 4px rgba(0,0,0,.8);

    text-shadow:0 1px 2px #000;
}


/* =========================================================
   PLAYER TWO
   Same typography as Player One
   ========================================================= */

#player2{
    position:absolute;

    right:330px;
    top:95px;

    width:360px;
    height:145px;

    z-index:6;
}

#player2Singles{
    position:absolute;
    inset:0;
}


/* PLAYER TWO NAME
   Same font size/weight as Player One.
   Extra container height prevents g/y/p/q/j clipping.
*/

#player2Name{
    position:absolute;

    right:24px;
    top:48px;

    width:330px;
    height:40px;

    display:flex;
    align-items:flex-start;
    justify-content:flex-end;

    font-size:27px;
    line-height:30px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;

    text-align:right;

    text-shadow:
        0 2px 2px #000,
        0 3px 5px rgba(0,0,0,.9);
}


/* PLAYER TWO FARGO
   Same font size as Player One.
*/

#player2SingleInfo{
    position:absolute;

    right:44px;
    top:105px;

    width:298px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    gap:13px;
}

#fargo2{
    flex:0 0 auto;

    font-size:20px;
    line-height:24px;

    color:#e2e2e2;

    white-space:nowrap;

    text-shadow:0 2px 3px #000;
}


/* =========================================================
   SCORES
   ========================================================= */

.score{
    position:absolute;

    width:102px;
    height:112px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:61px;
    line-height:1;

    font-weight:900;
    text-align:center;

    z-index:6;

    text-shadow:
        0 3px 3px #000,
        0 4px 7px rgba(0,0,0,.85);
}


/* PLAYER ONE SCORE — LOCKED */

#score1{
    left:696px;
    top:110px;
}


/* PLAYER TWO SCORE — FIRST CENTERING PASS */

#score2{
    right:696px;
    top:110px;
}


/* =========================================================
   MBP LOGO
   ========================================================= */

#mbpLogo{
    position:absolute;

    left:50%;
    top:53px;

    transform:translateX(-50%);

    width:230px;
    height:125px;

    object-fit:contain;

    z-index:5;
}


/* =========================================================
   LOWER INFORMATION BAR
   ========================================================= */

.lowerItem{
    position:absolute;

    top:202px;
    height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
    line-height:24px;

    font-weight:900;

    white-space:nowrap;

    z-index:5;

    text-shadow:0 2px 3px #000;
}

#gameBox{
    left:540px;
    width:245px;
}

#formatBox{
    left:785px;
    width:350px;
}

#raceBox{
    left:1135px;
    width:245px;
}


/* =========================================================
   BALL ICON
   ========================================================= */

#ballIcon{
    width:31px;
    height:31px;

    margin-right:10px;

    border-radius:50%;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    background:#f1c40f;

    border:2px solid #fff;

    color:#111;

    font-size:15px;
    line-height:15px;

    font-weight:900;

    text-shadow:none;
}


/* =========================================================
   OLD ONE POCKET COUNTER — DISABLED
   ========================================================= */

#onePocket{
    display:none !important;
}


/* =========================================================
   OPTIONAL VENUE
   ========================================================= */

#venue{
    display:none;

    position:absolute;

    left:50%;
    top:-45px;

    transform:translateX(-50%);

    padding:8px 24px;

    background:rgba(8,8,10,.92);

    border:1px solid #777;
    border-radius:7px;

    font-size:18px;
    font-weight:800;

    white-space:nowrap;

    z-index:8;
}

</style>
</head>

<body>

<div id="viewport">
<div id="frame">
<div id="scoreboard">


<img id="shell" src="scoreboard-shell.png" alt="">


<div id="leftSponsor">
    <img id="leftSponsorImg" src="" alt="">
</div>


<!-- =====================================================
     PLAYER ONE
     ===================================================== -->

<div id="player1">

    <div id="player1Singles">

        <div id="player1Name">
            PLAYER ONE
        </div>

        <div id="player1SingleInfo">

            <div id="fargo1">
                FargoRate 620
            </div>

            <div id="break1" class="breakIndicator">
                BREAK
            </div>

        </div>

    </div>


    <div id="player1Doubles">

        <div id="team1Name"></div>


        <div id="team1Row1">

            <div
                id="team1Player1Name"
                class="teamPlayerName"
            >
                PLAYER ONE
            </div>

            <div
                id="team1Player1Fargo"
                class="teamPlayerFargo"
            ></div>

        </div>


        <div id="team1Row2">

            <div
                id="team1Player2Name"
                class="teamPlayerName"
            ></div>

            <div
                id="team1Player2Fargo"
                class="teamPlayerFargo"
            ></div>

        </div>


        <div id="team1Bottom">

            <div id="team1Fargo"></div>

            <div
                id="break1Doubles"
                class="breakIndicator"
            >
                BREAK
            </div>

        </div>

    </div>

</div>


<!-- PLAYER ONE SCORE -->

<div id="score1" class="score">
    0
</div>


<!-- MBP LOGO -->

<img
    id="mbpLogo"
    src="mbp-logo.png"
    alt="McKenna Billiard Productions"
>


<!-- PLAYER TWO SCORE -->

<div id="score2" class="score">
    0
</div>


<!-- =====================================================
     PLAYER TWO
     ===================================================== -->

<div id="player2">

    <div id="player2Singles">

        <div id="player2Name">
            PLAYER TWO
        </div>

        <div id="player2SingleInfo">

            <div
                id="break2"
                class="breakIndicator"
            >
                BREAK
            </div>

            <div id="fargo2">
                FargoRate 598
            </div>

        </div>

    </div>

</div>


<!-- RIGHT SPONSOR -->

<div id="rightSponsor">
    <img id="rightSponsorImg" src="" alt="">
</div>


<!-- =====================================================
     LOWER BAR
     ===================================================== -->

<div id="gameBox" class="lowerItem">

    <span id="ballIcon">
        9
    </span>

    <span id="gameLabel">
        9-BALL
    </span>

</div>


<div id="formatBox" class="lowerItem">
    SINGLES
</div>


<div id="raceBox" class="lowerItem">
    RACE TO 5
</div>


<div id="onePocket">
    <span id="balls1">0</span>
    <span id="balls2">0</span>
</div>


<div id="venue"></div>


</div>
</div>
</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>


<script>

/* =========================================================
   SCALE MASTER FRAME
   ========================================================= */

function scaleFrame(){

    const frame =
        document.getElementById("frame");

    const scale =
        Math.min(
            window.innerWidth / 1920,
            window.innerHeight / 1080
        );

    frame.style.transform =
        "translate(-50%, -50%) scale(" +
        scale +
        ")";
}

window.addEventListener(
    "resize",
    scaleFrame
);

scaleFrame();



/* =========================================================
   FIREBASE
   ========================================================= */

firebase.initializeApp(firebaseConfig);

const database =
    firebase.database();

const matchRef =
    database.ref("match");



/* =========================================================
   PLAYER NAME FITTING
   SAME FUNCTION USED BY BOTH SIDES
   ========================================================= */

function fitPlayerName(element, name){

    element.textContent = name;

    const length = name.length;

    if(length > 24){
        element.style.fontSize = "21px";
    }

    else if(length > 20){
        element.style.fontSize = "23px";
    }

    else if(length > 17){
        element.style.fontSize = "25px";
    }

    else{
        element.style.fontSize = "27px";
    }
}



/* =========================================================
   FORMAT DETECTION
   ========================================================= */

function isScotchDoubles(data){

    const format =
        String(data.format || "")
        .trim()
        .toLowerCase();

    return (
        format === "scotch doubles" ||
        format === "scotch" ||
        format === "doubles"
    );
}



/* =========================================================
   RENDER MATCH
   ========================================================= */

function renderMatch(data){

    if(!data){
        return;
    }


    const p1 =
        data.player1 || {};

    const p2 =
        data.player2 || {};


    const doubles =
        isScotchDoubles(data);


    const player1Singles =
        document.getElementById(
            "player1Singles"
        );

    const player1Doubles =
        document.getElementById(
            "player1Doubles"
        );


    const team1 =
        data.team1 || {};


    const hasTeam1DoublesData =
        !!(
            team1.player2Name ||
            team1.player2?.name
        );


    const showTeam1Doubles =
        doubles &&
        hasTeam1DoublesData;


    player1Singles.style.display =
        showTeam1Doubles
        ? "none"
        : "block";


    player1Doubles.style.display =
        showTeam1Doubles
        ? "block"
        : "none";



    /* =====================================================
       PLAYER ONE — LOCKED
       ===================================================== */

    fitPlayerName(
        document.getElementById(
            "player1Name"
        ),
        p1.name || "PLAYER ONE"
    );


    document.getElementById(
        "fargo1"
    ).textContent =
        p1.fargo
        ? "FargoRate " + p1.fargo
        : "";



    /* =====================================================
       PLAYER ONE DOUBLES
       ===================================================== */

    if(showTeam1Doubles){

        const teamName =
            team1.name ||
            team1.teamName ||
            "";


        document.getElementById(
            "team1Name"
        ).textContent =
            teamName;


        const teamPlayer1Name =
            team1.player1Name ||
            team1.player1?.name ||
            p1.name ||
            "PLAYER ONE";


        const teamPlayer1Fargo =
            team1.player1Fargo ||
            team1.player1?.fargo ||
            p1.fargo ||
            "";


        const teamPlayer2Name =
            team1.player2Name ||
            team1.player2?.name ||
            "";


        const teamPlayer2Fargo =
            team1.player2Fargo ||
            team1.player2?.fargo ||
            "";


        document.getElementById(
            "team1Player1Name"
        ).textContent =
            teamPlayer1Name;


        document.getElementById(
            "team1Player1Fargo"
        ).textContent =
            teamPlayer1Fargo;


        document.getElementById(
            "team1Player2Name"
        ).textContent =
            teamPlayer2Name;


        document.getElementById(
            "team1Player2Fargo"
        ).textContent =
            teamPlayer2Fargo;


        const f1 =
            Number(teamPlayer1Fargo) || 0;

        const f2 =
            Number(teamPlayer2Fargo) || 0;


        const combined =
            Number(team1.combinedFargo) ||
            (
                f1 && f2
                ? f1 + f2
                : 0
            );


        document.getElementById(
            "team1Fargo"
        ).textContent =
            combined
            ? "TEAM FARGO " + combined
            : "";
    }



    /* =====================================================
       PLAYER TWO
       Same name-fitting rules as Player One
       ===================================================== */

    fitPlayerName(
        document.getElementById(
            "player2Name"
        ),
        p2.name || "PLAYER TWO"
    );


    document.getElementById(
        "fargo2"
    ).textContent =
        p2.fargo
        ? "FargoRate " + p2.fargo
        : "";



    /* =====================================================
       SCORES
       ===================================================== */

    document.getElementById(
        "score1"
    ).textContent =
        Number(p1.score) || 0;


    document.getElementById(
        "score2"
    ).textContent =
        Number(p2.score) || 0;



    /* =====================================================
       GAME
       ===================================================== */

    const game =
        data.game || "9-Ball";


    document.getElementById(
        "gameLabel"
    ).textContent =
        game.toUpperCase();


    const ballIcon =
        document.getElementById(
            "ballIcon"
        );


    if(game === "9-Ball"){

        ballIcon.style.display =
            "inline-flex";

        ballIcon.textContent =
            "9";
    }

    else if(game === "8-Ball"){

        ballIcon.style.display =
            "inline-flex";

        ballIcon.textContent =
            "8";
    }

    else if(game === "10-Ball"){

        ballIcon.style.display =
            "inline-flex";

        ballIcon.textContent =
            "10";
    }

    else{

        ballIcon.style.display =
            "none";
    }



    /* =====================================================
       RACE
       ===================================================== */

    document.getElementById(
        "raceBox"
    ).textContent =
        "RACE TO " +
        (
            data.race ||
            (
                game === "One Pocket"
                ? 3
                : 5
            )
        );



    /* =====================================================
       FORMAT
       ===================================================== */

    document.getElementById(
        "formatBox"
    ).textContent =
        data.format
        ? String(data.format).toUpperCase()
        : "SINGLES";



    /* =====================================================
       BREAK
       ===================================================== */

    const breaker =
        data.breaker ??
        data.breakPlayer ??
        data.break ??
        0;


    const player1Breaking =
        Number(breaker) === 1;


    document.getElementById(
        "break1"
    ).style.display =
        (
            player1Breaking &&
            !showTeam1Doubles
        )
        ? "block"
        : "none";


    document.getElementById(
        "break1Doubles"
    ).style.display =
        (
            player1Breaking &&
            showTeam1Doubles
        )
        ? "block"
        : "none";


    document.getElementById(
        "break2"
    ).style.display =
        Number(breaker) === 2
        ? "block"
        : "none";



    /* =====================================================
       ONE POCKET DATA
       ===================================================== */

    document.getElementById(
        "balls1"
    ).textContent =
        Number(data.balls1) || 0;


    document.getElementById(
        "balls2"
    ).textContent =
        Number(data.balls2) || 0;



    /* =====================================================
       VENUE
       ===================================================== */

    const venue =
        document.getElementById(
            "venue"
        );


    if(data.venue){

        venue.textContent =
            data.venue;

        venue.style.display =
            "block";
    }

    else{

        venue.style.display =
            "none";
    }



    /* =====================================================
       SPONSORS
       ===================================================== */

    if(data.leftSponsor){

        document.getElementById(
            "leftSponsorImg"
        ).src =
            data.leftSponsor;
    }


    if(data.rightSponsor){

        document.getElementById(
            "rightSponsorImg"
        ).src =
            data.rightSponsor;
    }
}



/* =========================================================
   LIVE FIREBASE LISTENER
   ========================================================= */

matchRef.on(
    "value",
    snapshot => {

        if(snapshot.exists()){

            renderMatch(
                snapshot.val()
            );
        }
    }
);

</script>

</body>
</html>
