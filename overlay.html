<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBP Overlay</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

#viewport{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#frame{
    position:absolute;
    width:1920px;
    height:1080px;
    left:50%;
    top:50%;
    transform-origin:center center;
}

/* =========================================================
   SCOREBOARD — LOCKED POSITION
   DO NOT MOVE
   ========================================================= */

#scoreboard{
    position:absolute;
    left:0;
    top:737px;
    width:1920px;
    height:325px;
}

/* =========================================================
   SHELL — LOCKED POSITION
   DO NOT MOVE
   ========================================================= */

#shell{
    position:absolute;
    width:1920px;
    height:1080px;
    left:0;
    top:-405px;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
    z-index:1;
}

/* =========================================================
   SPONSORS
   ========================================================= */

#leftSponsor{
    position:absolute;
    left:95px;
    top:66px;
    width:235px;
    height:132px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5;
}

#leftSponsor img{
    max-width:90%;
    max-height:88%;
    object-fit:contain;
}

#rightSponsor{
    position:absolute;
    right:95px;
    top:66px;
    width:235px;
    height:132px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5;
}

#rightSponsor img{
    max-width:90%;
    max-height:88%;
    object-fit:contain;
}

/* =========================================================
   PLAYER 1
   ========================================================= */

#player1{
    position:absolute;

    left:370px;
    top:66px;

    width:300px;
    height:110px;

    z-index:6;
}

/* PLAYER 1 NAME */

#player1Name{
    position:absolute;

    left:0;
    top:10px;

    width:300px;
    height:38px;

    display:flex;
    align-items:center;

    font-size:31px;
    line-height:34px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;

    text-shadow:
        0 2px 2px #000,
        0 3px 5px rgba(0,0,0,.9);
}

/* PLAYER 1 LOWER INFO LINE */

#player1Info{
    position:absolute;

    left:0;
    top:57px;

    width:300px;
    height:30px;

    display:flex;
    align-items:center;

    gap:14px;
}

/* FARGO DOES NOT MOVE */

#fargo1{
    flex:0 0 auto;

    font-size:20px;
    line-height:24px;

    color:#e2e2e2;

    text-shadow:
        0 2px 3px #000;
}

/* BREAK SITS TO RIGHT OF FARGO */

#break1{
    flex:0 0 auto;
}

/* =========================================================
   BREAK INDICATORS
   ========================================================= */

.breakIndicator{
    display:none;

    background:#ef1723;

    padding:4px 14px 5px;

    font-size:18px;
    line-height:20px;

    font-weight:900;
    font-style:italic;

    color:#fff;

    transform:skew(-10deg);

    box-shadow:
        0 2px 4px rgba(0,0,0,.8);

    text-shadow:
        0 1px 2px #000;
}

/* =========================================================
   PLAYER 2
   CURRENT POSITION PRESERVED
   ========================================================= */

#player2{
    position:absolute;

    right:370px;
    top:66px;

    width:300px;
    height:110px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    text-align:right;

    z-index:5;
}

#player2Name{
    width:100%;

    font-size:31px;
    line-height:34px;

    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    text-shadow:
        0 2px 2px #000,
        0 3px 5px rgba(0,0,0,.9);
}

#player2 .playerInfo{
    display:flex;
    align-items:center;
    justify-content:flex-end;

    margin-top:9px;

    gap:13px;
}

#fargo2{
    font-size:20px;
    line-height:24px;

    color:#e2e2e2;

    text-shadow:0 2px 3px #000;
}

/* =========================================================
   SCORES
   ========================================================= */

.score{
    position:absolute;

    top:61px;

    width:102px;
    height:112px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:61px;
    line-height:1;

    font-weight:900;

    text-align:center;

    z-index:6;

    text-shadow:
        0 3px 3px #000,
        0 4px 7px rgba(0,0,0,.85);
}

#score1{
    left:684px;
}

#score2{
    right:684px;
}

/* =========================================================
   CENTER MBP LOGO
   ========================================================= */

#mbpLogo{
    position:absolute;

    left:50%;
    top:53px;

    transform:translateX(-50%);

    width:230px;
    height:125px;

    object-fit:contain;

    z-index:5;
}

/* =========================================================
   LOWER INFORMATION BAR
   ========================================================= */

.lowerItem{
    position:absolute;

    top:202px;
    height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
    line-height:24px;

    font-weight:900;

    white-space:nowrap;

    z-index:5;

    text-shadow:
        0 2px 3px #000;
}

#gameBox{
    left:540px;
    width:245px;
}

#formatBox{
    left:785px;
    width:350px;
}

#raceBox{
    left:1135px;
    width:245px;
}

/* =========================================================
   BALL ICON
   ========================================================= */

#ballIcon{
    width:31px;
    height:31px;

    margin-right:10px;

    border-radius:50%;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    background:#f1c40f;

    border:2px solid #fff;

    color:#111;

    font-size:15px;
    line-height:15px;

    font-weight:900;

    text-shadow:none;
}

/* =========================================================
   ONE POCKET
   ========================================================= */

#onePocket{
    display:none;

    position:absolute;

    left:50%;
    top:3px;

    transform:translateX(-50%);

    height:48px;

    background:rgba(5,5,7,.96);

    border:1px solid #777;
    border-radius:7px;

    overflow:hidden;

    z-index:8;
}

.ballCounter{
    min-width:150px;

    padding:7px 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    font-size:16px;
    font-weight:800;
}

.ballCounter:first-child{
    border-right:1px solid #555;
}

.ballCounter strong{
    font-size:25px;
}

/* =========================================================
   VENUE
   ========================================================= */

#venue{
    display:none;

    position:absolute;

    left:50%;
    top:-45px;

    transform:translateX(-50%);

    padding:8px 24px;

    background:rgba(8,8,10,.92);

    border:1px solid #777;
    border-radius:7px;

    font-size:18px;
    font-weight:800;

    white-space:nowrap;

    z-index:8;
}

</style>
</head>

<body>

<div id="viewport">

    <div id="frame">

        <div id="scoreboard">

            <img
                id="shell"
                src="scoreboard-shell.png"
                alt=""
            >

            <!-- LEFT SPONSOR -->

            <div id="leftSponsor">
                <img
                    id="leftSponsorImg"
                    src=""
                    alt=""
                >
            </div>

            <!-- =====================================================
                 PLAYER ONE
                 ===================================================== -->

            <div id="player1">

                <div id="player1Name">
                    PLAYER ONE
                </div>

                <div id="player1Info">

                    <!--
                        Fargo is ALWAYS first on Player 1.
                        It never changes position.
                    -->

                    <div id="fargo1">
                        FargoRate 620
                    </div>

                    <!--
                        BREAK appears to the RIGHT of Fargo.
                    -->

                    <div
                        id="break1"
                        class="breakIndicator"
                    >
                        BREAK
                    </div>

                </div>

            </div>

            <!-- SCORE ONE -->

            <div
                id="score1"
                class="score"
            >
                0
            </div>

            <!-- MBP LOGO -->

            <img
                id="mbpLogo"
                src="mbp-logo.png"
                alt="McKenna Billiard Productions"
            >

            <!-- SCORE TWO -->

            <div
                id="score2"
                class="score"
            >
                0
            </div>

            <!-- PLAYER TWO -->

            <div id="player2">

                <div id="player2Name">
                    PLAYER TWO
                </div>

                <div class="playerInfo">

                    <!--
                        BREAK is already on the LEFT side
                        for Player 2.
                    -->

                    <div
                        id="break2"
                        class="breakIndicator"
                    >
                        BREAK
                    </div>

                    <div id="fargo2">
                        FargoRate 598
                    </div>

                </div>

            </div>

            <!-- RIGHT SPONSOR -->

            <div id="rightSponsor">
                <img
                    id="rightSponsorImg"
                    src=""
                    alt=""
                >
            </div>

            <!-- LOWER BAR -->

            <div
                id="gameBox"
                class="lowerItem"
            >

                <span id="ballIcon">
                    9
                </span>

                <span id="gameLabel">
                    9-BALL
                </span>

            </div>

            <div
                id="formatBox"
                class="lowerItem"
            >
                SCOTCH DOUBLES
            </div>

            <div
                id="raceBox"
                class="lowerItem"
            >
                RACE TO 5
            </div>

            <!-- ONE POCKET -->

            <div id="onePocket">

                <div class="ballCounter">
                    P1 BALLS
                    <strong id="balls1">0</strong>
                </div>

                <div class="ballCounter">
                    P2 BALLS
                    <strong id="balls2">0</strong>
                </div>

            </div>

            <div id="venue"></div>

        </div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>

<script>

/* =========================================================
   SCALE MASTER FRAME
   ========================================================= */

function scaleFrame(){

    const frame =
        document.getElementById("frame");

    const scale =
        Math.min(
            window.innerWidth / 1920,
            window.innerHeight / 1080
        );

    frame.style.transform =
        "translate(-50%, -50%) scale(" +
        scale +
        ")";
}

window.addEventListener(
    "resize",
    scaleFrame
);

scaleFrame();


/* =========================================================
   FIREBASE
   ========================================================= */

firebase.initializeApp(
    firebaseConfig
);

const database =
    firebase.database();

const matchRef =
    database.ref("match");


/* =========================================================
   NAME FITTING
   ========================================================= */

function fitPlayerName(element, name){

    element.textContent = name;

    const length = name.length;

    if(length > 22){
        element.style.fontSize = "24px";
    }
    else if(length > 18){
        element.style.fontSize = "27px";
    }
    else if(length > 14){
        element.style.fontSize = "29px";
    }
    else{
        element.style.fontSize = "31px";
    }
}


/* =========================================================
   RENDER MATCH
   ========================================================= */

function renderMatch(data){

    if(!data){
        return;
    }

    const p1 =
        data.player1 || {};

    const p2 =
        data.player2 || {};


    /* =====================================================
       PLAYER NAMES
       ===================================================== */

    fitPlayerName(
        document.getElementById("player1Name"),
        p1.name || "PLAYER ONE"
    );

    document.getElementById(
        "player2Name"
    ).textContent =
        p2.name || "PLAYER TWO";


    /* =====================================================
       SCORES
       ===================================================== */

    document.getElementById(
        "score1"
    ).textContent =
        Number(p1.score) || 0;

    document.getElementById(
        "score2"
    ).textContent =
        Number(p2.score) || 0;


    /* =====================================================
       FARGORATE
       ===================================================== */

    document.getElementById(
        "fargo1"
    ).textContent =
        p1.fargo
        ? "FargoRate " + p1.fargo
        : "";

    document.getElementById(
        "fargo2"
    ).textContent =
        p2.fargo
        ? "FargoRate " + p2.fargo
        : "";


    /* =====================================================
       GAME
       ===================================================== */

    const game =
        data.game || "9-Ball";

    document.getElementById(
        "gameLabel"
    ).textContent =
        game.toUpperCase();


    /* BALL ICON */

    const ballIcon =
        document.getElementById(
            "ballIcon"
        );

    if(game === "9-Ball"){

        ballIcon.style.display =
            "inline-flex";

        ballIcon.textContent =
            "9";
    }

    else if(game === "8-Ball"){

        ballIcon.style.display =
            "inline-flex";

        ballIcon.textContent =
            "8";
    }

    else if(game === "10-Ball"){

        ballIcon.style.display =
            "inline-flex";

        ballIcon.textContent =
            "10";
    }

    else{

        ballIcon.style.display =
            "none";
    }


    /* =====================================================
       RACE
       ===================================================== */

    document.getElementById(
        "raceBox"
    ).textContent =
        game === "One Pocket"
        ? "RACE TO " + (data.race || 3)
        : "RACE TO " + (data.race || 5);


    /* =====================================================
       FORMAT
       ===================================================== */

    document.getElementById(
        "formatBox"
    ).textContent =
        data.format ||
        "SCOTCH DOUBLES";


    /* =====================================================
       BREAK INDICATOR
       ===================================================== */

    const breaker =
        data.breaker ??
        data.breakPlayer ??
        data.break ??
        0;

    document.getElementById(
        "break1"
    ).style.display =
        Number(breaker) === 1
        ? "block"
        : "none";

    document.getElementById(
        "break2"
    ).style.display =
        Number(breaker) === 2
        ? "block"
        : "none";


    /* =====================================================
       ONE POCKET
       ===================================================== */

    const onePocket =
        document.getElementById(
            "onePocket"
        );

    if(game === "One Pocket"){

        onePocket.style.display =
            "flex";

        document.getElementById(
            "balls1"
        ).textContent =
            Number(data.balls1) || 0;

        document.getElementById(
            "balls2"
        ).textContent =
            Number(data.balls2) || 0;
    }

    else{

        onePocket.style.display =
            "none";
    }


    /* =====================================================
       VENUE
       ===================================================== */

    const venue =
        document.getElementById(
            "venue"
        );

    if(data.venue){

        venue.textContent =
            data.venue;

        venue.style.display =
            "block";
    }

    else{

        venue.style.display =
            "none";
    }


    /* =====================================================
       SPONSORS
       ===================================================== */

    if(data.leftSponsor){

        document.getElementById(
            "leftSponsorImg"
        ).src =
            data.leftSponsor;
    }

    if(data.rightSponsor){

        document.getElementById(
            "rightSponsorImg"
        ).src =
            data.rightSponsor;
    }
}


/* =========================================================
   LIVE LISTENER
   ========================================================= */

matchRef.on(
    "value",
    snapshot => {

        if(snapshot.exists()){

            renderMatch(
                snapshot.val()
            );
        }
    }
);

</script>

</body>
</html>
