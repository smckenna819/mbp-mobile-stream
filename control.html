<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MBP Match Controller</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #080808;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
}

.logo {
  text-align: center;
  margin-bottom: 10px;
}

.logo img {
  max-width: 150px;
  max-height: 90px;
}

h1 {
  text-align: center;
  margin: 8px 0 20px;
  font-size: 25px;
}

.card {
  background: #151515;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 15px;
}

label {
  display: block;
  font-size: 13px;
  color: #aaa;
  margin-bottom: 6px;
}

input, select {
  width: 100%;
  background: #222;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
  padding: 12px;
  font-size: 16px;
  margin-bottom: 12px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.player-title {
  font-size: 19px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 12px;
}

.score {
  font-size: 62px;
  font-weight: bold;
  text-align: center;
  margin: 10px 0;
}

.score-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 14px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.plus {
  background: #19a64a;
  color: white;
}

.minus {
  background: #444;
  color: white;
}

.primary {
  width: 100%;
  background: #e31b23;
  color: white;
  margin-top: 6px;
}

.secondary {
  width: 100%;
  background: #333;
  color: white;
  margin-top: 10px;
}

.danger {
  width: 100%;
  background: #8b1117;
  color: white;
  margin-top: 10px;
}

.status {
  text-align: center;
  padding: 10px;
  margin-bottom: 14px;
  border-radius: 8px;
  background: #252525;
  color: #aaa;
  font-size: 14px;
}

.status.connected {
  color: #6dff8a;
}

@media(max-width: 520px) {
  body {
    padding: 10px;
  }

  .row {
    grid-template-columns: 1fr;
  }

  .score {
    font-size: 52px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <img src="mbp-logo.png" alt="MBP">
  </div>

  <h1>MBP Match Controller</h1>

  <div id="status" class="status">
    Connecting to Firebase...
  </div>

  <div class="card">

    <label>Event / Venue</label>
    <input id="venue" type="text" placeholder="Venue or event name">

    <div class="row">

      <div>
        <label>Game</label>
        <select id="game">
          <option value="9-Ball">9-Ball</option>
          <option value="8-Ball">8-Ball</option>
          <option value="10-Ball">10-Ball</option>
          <option value="One Pocket">One Pocket</option>
          <option value="Banks">Banks</option>
        </select>
      </div>

      <div>
        <label>Race To</label>
        <input id="race" type="number" min="1" value="5">
      </div>

    </div>

  </div>


  <div class="row">

    <div class="card">

      <div class="player-title">Player 1</div>

      <label>Name</label>
      <input id="player1" type="text" placeholder="Player 1">

      <label>FargoRate</label>
      <input id="fargo1" type="number" placeholder="Fargo">

      <div id="score1" class="score">0</div>

      <div class="score-buttons">
        <button id="minus1" class="minus">−1</button>
        <button id="plus1" class="plus">+1</button>
      </div>

    </div>


    <div class="card">

      <div class="player-title">Player 2</div>

      <label>Name</label>
      <input id="player2" type="text" placeholder="Player 2">

      <label>FargoRate</label>
      <input id="fargo2" type="number" placeholder="Fargo">

      <div id="score2" class="score">0</div>

      <div class="score-buttons">
        <button id="minus2" class="minus">−1</button>
        <button id="plus2" class="plus">+1</button>
      </div>

    </div>

  </div>


  <div class="card">

    <button id="swap" class="secondary">
      ⇄ Swap Players
    </button>

    <button id="resetScores" class="danger">
      Reset Scores
    </button>

    <button id="newMatch" class="primary">
      New Match
    </button>

  </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script src="config.js"></script>

<script>

firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const matchRef = database.ref("match");

let match = {
  venue: "",
  game: "9-Ball",
  race: 5,

  player1: {
    name: "",
    fargo: "",
    score: 0
  },

  player2: {
    name: "",
    fargo: "",
    score: 0
  }
};


const statusBox = document.getElementById("status");

firebase.database().ref(".info/connected").on("value", snapshot => {

  if (snapshot.val() === true) {

    statusBox.textContent = "● Connected — changes are live";
    statusBox.classList.add("connected");

  } else {

    statusBox.textContent = "Connecting to Firebase...";
    statusBox.classList.remove("connected");

  }

});


function render() {

  document.getElementById("venue").value = match.venue || "";
  document.getElementById("game").value = match.game || "9-Ball";
  document.getElementById("race").value = match.race || 5;

  document.getElementById("player1").value = match.player1?.name || "";
  document.getElementById("fargo1").value = match.player1?.fargo || "";
  document.getElementById("score1").textContent = match.player1?.score ?? 0;

  document.getElementById("player2").value = match.player2?.name || "";
  document.getElementById("fargo2").value = match.player2?.fargo || "";
  document.getElementById("score2").textContent = match.player2?.score ?? 0;
}


matchRef.on("value", snapshot => {

  if (snapshot.exists()) {

    const data = snapshot.val();

    match = {
      venue: data.venue || "",
      game: data.game || "9-Ball",
      race: Number(data.race) || 5,

      player1: {
        name: data.player1?.name || "",
        fargo: data.player1?.fargo || "",
        score: Number(data.player1?.score) || 0
      },

      player2: {
        name: data.player2?.name || "",
        fargo: data.player2?.fargo || "",
        score: Number(data.player2?.score) || 0
      }
    };

    render();

  } else {

    matchRef.set(match);

  }

});


function updateField(path, value) {
  return matchRef.child(path).set(value);
}


document.getElementById("venue").addEventListener("change", e => {
  updateField("venue", e.target.value);
});

document.getElementById("game").addEventListener("change", e => {
  updateField("game", e.target.value);
});

document.getElementById("race").addEventListener("change", e => {
  updateField("race", Number(e.target.value) || 1);
});

document.getElementById("player1").addEventListener("change", e => {
  updateField("player1/name", e.target.value);
});

document.getElementById("fargo1").addEventListener("change", e => {
  updateField("player1/fargo", e.target.value);
});

document.getElementById("player2").addEventListener("change", e => {
  updateField("player2/name", e.target.value);
});

document.getElementById("fargo2").addEventListener("change", e => {
  updateField("player2/fargo", e.target.value);
});


document.getElementById("plus1").onclick = () => {

  matchRef.child("player1/score")
    .transaction(score => (Number(score) || 0) + 1);

};


document.getElementById("minus1").onclick = () => {

  matchRef.child("player1/score")
    .transaction(score => Math.max(0, (Number(score) || 0) - 1));

};


document.getElementById("plus2").onclick = () => {

  matchRef.child("player2/score")
    .transaction(score => (Number(score) || 0) + 1);

};


document.getElementById("minus2").onclick = () => {

  matchRef.child("player2/score")
    .transaction(score => Math.max(0, (Number(score) || 0) - 1));

};


document.getElementById("swap").onclick = () => {

  matchRef.transaction(current => {

    if (!current) return current;

    const temp = current.player1;
    current.player1 = current.player2;
    current.player2 = temp;

    return current;

  });

};


document.getElementById("resetScores").onclick = () => {

  matchRef.update({
    "player1/score": 0,
    "player2/score": 0
  });

};


document.getElementById("newMatch").onclick = () => {

  if (!confirm("Start a new match and reset both scores?")) return;

  matchRef.update({
    "player1/score": 0,
    "player2/score": 0
  });

};

</script>

</body>
</html>
